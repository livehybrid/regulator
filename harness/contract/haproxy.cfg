global
    log stdout format raw local0

defaults
    mode tcp
    timeout connect 5s
    timeout client 300s
    timeout server 300s

# Round robin per connection, no stickiness. Regulator's client keeps
# connections alive, so a fresh connection per request is what makes
# consecutive requests land on different members; the contract test opens one
# per request on purpose.
frontend mgmt
    bind *:8089
    default_backend members

backend members
    balance roundrobin
    server sh1 sh1:8089 check
    server sh2 sh2:8089 check
    server sh3 sh3:8089 check
