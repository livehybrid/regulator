# Copy to infra/k8s/secret.yaml (ignored by git) and fill in real values before
# applying. Both keys are required: an invalid Fernet key is a fatal boot error,
# and an unset password means the control plane runs with no authentication.
apiVersion: v1
kind: Secret
metadata:
  name: regulator
  namespace: regulator
type: Opaque
stringData:
  # Encrypts every target credential at rest. Generate with:
  #   python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())'
  # Back it up: credentials encrypted under it are unrecoverable without it.
  REG_MASTER_KEY: "GENERATE-ME"
  # The single operator password for the web interface.
  REG_ADMIN_PASSWORD: "CHOOSE-ME"
  # Optional: bearer tokens for CI and scripts, comma separated. The GitHub
  # Action presents one of these as Authorization: Bearer.
  REG_API_TOKENS: ""
---
# The native Splunk account the browser worker logs in to Splunk Web with.
# A bearer token authenticates the REST API but not a web session.
apiVersion: v1
kind: Secret
metadata:
  name: regulator-splunk
  namespace: regulator
type: Opaque
stringData:
  username: "loadtest"
  password: "CHOOSE-ME"
