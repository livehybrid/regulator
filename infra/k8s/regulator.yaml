# Regulator on Kubernetes, for running it in the same cluster as the Splunk it
# measures.
#
# THE PLACEMENT IS THE POINT. A load generator sharing nodes with the system
# under test competes with it for CPU, memory and network, so the benchmark
# measures the contention it created rather than the cluster's behaviour. Every
# pod here is pinned to a node group labelled `workload=regulator` and tolerates
# a matching taint, so nothing else lands there and it lands nowhere else.
#
# Create that node group first. On EKS:
#
#   eksctl create nodegroup --cluster <name> --name regulator \
#     --node-labels workload=regulator \
#     --node-type m6i.2xlarge --nodes 1 \
#     --taints workload=regulator:NoSchedule
#
# Without the taint the scheduler is free to put other people's pods on your
# load box, which is the same problem in reverse.
---
apiVersion: v1
kind: Namespace
metadata:
  name: regulator
  labels:
    app.kubernetes.io/name: regulator
# The Secret is deliberately NOT in this file. Copy infra/k8s/secret.example.yaml
# to infra/k8s/secret.yaml (which .gitignore excludes), generate a real Fernet
# key, and apply that first:
#
#   cp infra/k8s/secret.example.yaml infra/k8s/secret.yaml
#   python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())'
#   $EDITOR infra/k8s/secret.yaml
#   kubectl apply -f infra/k8s/secret.yaml -f infra/k8s/regulator.yaml
#
# Applying this manifest with a placeholder key does not degrade gracefully:
# the server treats a malformed master key as fatal, so the pod crash-loops.
---
# The control plane creates and removes worker Jobs, their token Secrets and
# reads their pods' logs. Nothing outside its own namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: regulator
  namespace: regulator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: regulator-fleet
  namespace: regulator
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: regulator-fleet
  namespace: regulator
subjects:
  - kind: ServiceAccount
    name: regulator
    namespace: regulator
roleRef:
  kind: Role
  name: regulator-fleet
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: regulator-data
  namespace: regulator
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: regulator
  namespace: regulator
  labels:
    app.kubernetes.io/name: regulator
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the control plane owns a SQLite file on one
  # ReadWriteOnce volume, so two pods must never contend for it during a
  # rollout.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: regulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: regulator
    spec:
      nodeSelector:
        workload: regulator
      tolerations:
        - key: workload
          operator: Equal
          value: regulator
          effect: NoSchedule
      # The image creates /data owned by uid 10012, but mounting a PVC there
      # shadows that: a fresh volume arrives root-owned and the pod cannot
      # create its database. fsGroup makes the kubelet fix the group ownership.
      # OnRootMismatch so it does not walk the whole volume on every restart.
      securityContext:
        runAsUser: 10012
        runAsGroup: 10012
        runAsNonRoot: true
        fsGroup: 10012
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # The control plane launches worker Jobs in its own namespace through
      # the service account below, and nothing wider.
      serviceAccountName: regulator
      automountServiceAccountToken: true
      # The control plane drains in-flight runs on SIGTERM rather than
      # abandoning them mid-measurement.
      terminationGracePeriodSeconds: 120
      containers:
        - name: regulator
          image: ghcr.io/livehybrid/regulator:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - secretRef:
                name: regulator
          env:
            - name: REG_DATABASE_URL
              value: sqlite:////data/regulator.db
            # The in-process ceiling. The control plane generates the load
            # itself, so this is sized to the node group above rather than to
            # how many users you wish you could simulate. Raising it past what
            # the node can carry does not produce more load, it produces runs
            # marked invalid by the generator-drift guard.
            - name: REG_MAX_VIRTUAL_USERS
              value: "300"
            - name: REG_MAX_CONCURRENT_RUNS
              value: "1"
            # Imported scenarios live on the same volume as the database.
            - name: REG_USER_SCENARIOS_DIR
              value: /data/scenarios
            # The Kubernetes fleet: worker Jobs in this namespace, on the
            # regulator node group, reaching this Service by name.
            - name: REG_DEFAULT_FLEET
              value: k8s
            - name: REG_K8S_IN_CLUSTER
              value: "1"
            - name: REG_K8S_NAMESPACE
              value: regulator
            - name: REG_K8S_NODE_SELECTOR
              value: workload=regulator
            - name: REG_PUBLIC_BASE_URL
              value: http://regulator.regulator.svc:8080
            # Telemetry for every run launched here. Fill in, or leave unset.
            # - name: REG_HEC_URL
            #   value: https://hec.splunk.svc:8088
            # - name: REG_HEC_VERIFY_TLS
            #   value: "0"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              # No CPU limit on purpose. A throttled load generator cannot keep
              # to its own schedule, and the result is a run marked invalid
              # rather than a slow one. Requests reserve the capacity; a limit
              # would cap it at exactly the wrong moment.
              memory: 4Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: regulator-data
---
apiVersion: v1
kind: Service
metadata:
  name: regulator
  namespace: regulator
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: regulator
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Only pods labelled as the ingress path may reach the control plane. A
# service with one shared password that can evict a production cache should
# not be reachable from every pod in the cluster. Adjust the selector to your
# ingress controller's namespace and labels.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: regulator
  namespace: regulator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: regulator
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
