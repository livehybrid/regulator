<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regulator</title>
<style>
/* Dark by default. The light theme is a deliberate override, not the base. */
:root{
  --bg:#0d1117; --panel:#141b23; --panel2:#1a2430; --line:#26313d;
  --fg:#d8e2ec; --muted:#8ba0b4; --accent:#54b9ff; --accent-dim:#1d3b52;
  --ok:#4ade80; --warn:#f5b544; --bad:#f2555a; --shadow:rgba(0,0,0,.55);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f4f6f8; --panel:#ffffff; --panel2:#eef2f6; --line:#d3dbe3;
    --fg:#16212c; --muted:#5c6f80; --accent:#0a6bbd; --accent-dim:#d3e7f8;
    --ok:#177a3d; --warn:#8a5a00; --bad:#b32026; --shadow:rgba(0,0,0,.14);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:13px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font-size:17px;margin:0}
h2{font-size:14px;margin:0 0 8px}
h3{font-size:12px;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
a{color:var(--accent)}
code,.mono,td.num,th.num{font-family:var(--mono)}
.hidden{display:none !important}
.muted{color:var(--muted)}
.small{font-size:12px}
.right{text-align:right}

/* Shell */
#app{display:grid;grid-template-columns:196px 1fr;min-height:100vh}
nav{background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;
  display:flex;flex-direction:column;gap:4px}
.brand{font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:13px;
  padding:4px 8px 12px;color:var(--accent)}
.brand span{display:block;font-size:10px;letter-spacing:.04em;text-transform:none;
  color:var(--muted);font-weight:400;margin-top:3px}
nav a.navlink{display:block;padding:7px 9px;border-radius:4px;color:var(--fg);
  text-decoration:none;font-size:13px}
nav a.navlink:hover{background:var(--panel2)}
nav a.navlink.active{background:var(--accent-dim);color:var(--accent)}
nav .spacer{flex:1}
main{padding:16px 18px 60px;min-width:0}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:12px;margin-bottom:14px}

/* Buttons */
.btn{font:inherit;background:var(--panel2);color:var(--fg);border:1px solid var(--line);
  border-radius:4px;padding:4px 10px;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#04121d;font-weight:600}
.btn.primary:hover:not(:disabled){filter:brightness(1.1);color:#04121d}
@media (prefers-color-scheme: light){
  .btn.primary,.btn.primary:hover:not(:disabled){color:#fff}
}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger:hover:not(:disabled){background:var(--bad);color:#fff}
.btn.ghost{background:transparent}
.btn.busy{position:relative;color:transparent !important}
.btn.busy::after{content:"";position:absolute;inset:0;margin:auto;width:11px;height:11px;
  border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;
  animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.btns{display:flex;gap:5px;flex-wrap:wrap}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;
  letter-spacing:.05em;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:var(--panel2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.clickable{cursor:pointer}
tr.inline td{border-bottom:1px solid var(--line);background:var(--panel2);font-size:12px}

/* Forms */
label.f{display:block;margin:0 0 8px}
label.f > span{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
input[type=text],input[type=password],input[type=number],select,textarea{
  width:100%;font:inherit;font-family:var(--mono);background:var(--bg);color:var(--fg);
  border:1px solid var(--line);border-radius:4px;padding:5px 7px}
input:focus,select:focus{outline:1px solid var(--accent);border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0 14px}
.chk{display:flex;align-items:center;gap:6px;margin:0 0 8px;font-size:12.5px}
.chk input{width:auto}

/* Status pills */
.pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:600;
  border:1px solid var(--line);white-space:nowrap}
.pill.ok{color:var(--ok);border-color:var(--ok)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.info{color:var(--accent);border-color:var(--accent)}
.pill.idle{color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:5px}
.dot.run{background:var(--accent);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

/* Banners */
.banner{border-radius:5px;padding:10px 12px;margin-bottom:10px;border:1px solid var(--line);
  background:var(--panel);border-left-width:4px}
.banner b{display:block;margin-bottom:3px}
.banner.bad{border-left-color:var(--bad)} .banner.bad b{color:var(--bad)}
.banner.warn{border-left-color:var(--warn)} .banner.warn b{color:var(--warn)}
.banner.info{border-left-color:var(--accent)} .banner.info b{color:var(--accent)}
.note{color:var(--muted);font-size:12px;border-left:2px solid var(--line);padding:2px 0 2px 9px;margin:5px 0}

/* Tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:8px;margin-bottom:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:8px 10px}
.tile .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tile .v{font-family:var(--mono);font-size:19px;margin-top:3px;font-variant-numeric:tabular-nums}
.tile .sub{font-size:11px;color:var(--muted);font-family:var(--mono)}
.tile.bad .v{color:var(--bad)} .tile.warn .v{color:var(--warn)} .tile.ok .v{color:var(--ok)}

/* Cards (scenarios) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:11px;
  display:flex;flex-direction:column;gap:7px}
.card .t{font-weight:600;font-family:var(--mono)}
.tag{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:3px;
  padding:0 5px;font-size:11px;font-family:var(--mono);color:var(--muted);margin:0 3px 3px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--mono)}

/* Fill bar */
.bar{height:9px;background:var(--panel2);border:1px solid var(--line);border-radius:5px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent)}
.bar > i.warn{background:var(--warn)} .bar > i.bad{background:var(--bad)}

/* Dialog */
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;
  padding:0;width:min(760px,94vw);box-shadow:0 18px 48px var(--shadow)}
dialog.wide{width:min(1080px,96vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg-h{padding:11px 14px;border-bottom:1px solid var(--line);font-weight:600}
.dlg-b{padding:14px;max-height:min(70vh,720px);overflow:auto}
.dlg-f{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:6px;justify-content:flex-end}

/* Login */
#login{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
#login .panel{width:320px}

/* Toasts */
#toasts{position:fixed;right:14px;bottom:14px;display:flex;flex-direction:column;gap:7px;z-index:50;
  max-width:min(430px,90vw)}
.toast{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--bad);
  border-radius:5px;padding:9px 11px;cursor:pointer;box-shadow:0 8px 22px var(--shadow);font-size:12.5px}
.toast.info{border-left-color:var(--accent)}
.toast.ok{border-left-color:var(--ok)}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:10px;margin-bottom:14px}
.chart svg{max-width:100%;height:auto;display:block}
.scroll{overflow-x:auto}
.url{font-family:var(--mono);font-size:12px;word-break:break-all}
</style>
</head>
<body>

<div id="login" class="hidden">
  <form class="panel" id="loginForm">
    <div class="brand">Regulator<span>Search load generation for Splunk</span></div>
    <p id="loginNote" class="muted small hidden"></p>
    <label class="f"><span>Password</span><input type="password" id="loginPw" autocomplete="current-password" required></label>
    <button class="btn primary" id="loginBtn" type="submit" style="width:100%">Sign in</button>
  </form>
</div>

<div id="app" class="hidden">
  <nav>
    <div class="brand">Regulator<span>Search load for Splunk</span></div>
    <a class="navlink" href="#targets" data-route="targets">Targets</a>
    <a class="navlink" href="#scenarios" data-route="scenarios">Scenarios</a>
    <a class="navlink" href="#runs" data-route="runs">Runs</a>
    <a class="navlink" href="#baselines" data-route="baselines">Baselines</a>
    <a class="navlink" href="#audit" data-route="audit">Audit</a>
    <div style="height:8px"></div>
    <button class="btn primary" data-act="launch">Launch a run</button>
    <div class="spacer"></div>
    <button class="btn ghost" id="logoutBtn" data-act="logout">Sign out</button>
  </nav>
  <main>
    <div id="openBanner"></div>
    <div id="view"></div>
  </main>
</div>

<dialog id="dlg">
  <div class="dlg-h" id="dlgTitle"></div>
  <div class="dlg-b" id="dlgBody"></div>
  <div class="dlg-f" id="dlgFoot"></div>
</dialog>

<div id="toasts"></div>

<script>
"use strict";
const $ = (s, r) => (r || document).querySelector(s);
const state = { targets: [], scenarios: [], lastJson: null, currentRun: null, setupNeeded: false };
let pollTimer = null;      // run-detail poll handle
let pollGeneration = 0;    // bumped on every navigation, so a stale tick never reschedules
let samples = [];          // client-side latency history for the live chart
let samplesRunId = null;

/* ---------- formatting ---------- */
const esc = s => String(s === null || s === undefined ? "" : s)
  .replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => (v === null || v === undefined || Number.isNaN(v));
function fmtInt(v){ return num(v) ? "\u2013" : Math.round(v).toLocaleString("en-GB"); }
function fmtNum(v, dp){ return num(v) ? "\u2013" : Number(v).toFixed(dp === undefined ? 2 : dp); }
function fmtPct(v, dp){ return num(v) ? "\u2013" : Number(v).toFixed(dp === undefined ? 1 : dp) + "%"; }
function fmtMs(v){
  if (num(v)) return "\u2013";
  if (v >= 10000) return (v / 1000).toFixed(1) + " s";
  if (v >= 1000) return (v / 1000).toFixed(2) + " s";
  if (v >= 10) return Math.round(v).toLocaleString("en-GB") + " ms";
  return Number(v).toFixed(1) + " ms";
}
function fmtBytes(b){
  if (num(b)) return "\u2013";
  const u = ["B", "KB", "MB", "GB", "TB", "PB"]; let i = 0, n = Number(b);
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n.toFixed(0) : n.toFixed(1)) + " " + u[i];
}
function fmtDur(s){
  if (num(s)) return "\u2013";
  if (s < 90) return Number(s).toFixed(s < 10 ? 1 : 0) + " s";
  const m = Math.floor(s / 60), r = Math.round(s % 60);
  if (m < 60) return m + "m " + r + "s";
  return Math.floor(m / 60) + "h " + (m % 60) + "m";
}
function toDate(v){
  if (v === null || v === undefined || v === "") return null;
  const d = typeof v === "number" ? new Date(v * (v > 1e11 ? 1 : 1000)) : new Date(v);
  return isNaN(d.getTime()) ? null : d;
}
function fmtWhen(v){
  const d = toDate(v); if (!d) return "\u2013";
  const diff = (Date.now() - d.getTime()) / 1000;
  const rel = diff < 60 ? Math.max(0, Math.round(diff)) + "s ago"
    : diff < 3600 ? Math.round(diff / 60) + "m ago"
    : diff < 86400 ? Math.round(diff / 3600) + "h ago"
    : Math.round(diff / 86400) + "d ago";
  return '<span title="' + esc(d.toLocaleString("en-GB")) + '">' + esc(rel) + "</span>";
}

/* ---------- api ---------- */
class ApiError extends Error { constructor(msg, status){ super(msg); this.status = status; } }
async function api(path, opts){
  opts = opts || {};
  const init = { method: opts.method || "GET", credentials: "same-origin", headers: {} };
  if (opts.body !== undefined) { init.headers["Content-Type"] = "application/json"; init.body = JSON.stringify(opts.body); }
  let res;
  try { res = await fetch("/api" + path, init); }
  catch (e) { throw new ApiError("Cannot reach the Regulator server: " + e.message, 0); }
  if (res.status === 401) { showLogin(); throw new ApiError("Session expired, please sign in again", 401); }
  if (res.status === 204) return null;
  const text = await res.text();
  let data = null;
  if (text) { try { data = JSON.parse(text); } catch (e) { data = text; } }
  if (!res.ok) {
    let d = data && typeof data === "object" ? (data.detail || data.error || data.message) : data;
    if (d && typeof d === "object") d = JSON.stringify(d);
    throw new ApiError(String(d || res.statusText || ("HTTP " + res.status)), res.status);
  }
  return data;
}
function toast(msg, kind){
  const t = document.createElement("div");
  t.className = "toast " + (kind || "");
  t.textContent = String(msg);
  t.addEventListener("click", () => t.remove());
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), kind === "ok" || kind === "info" ? 6000 : 12000);
}
// Wraps a click handler so the button shows a spinner while its call is in flight
// (the target report can take the best part of a minute).
async function busy(btn, fn){
  if (!btn || btn.disabled) return;
  btn.disabled = true; btn.classList.add("busy");
  try { await fn(); }
  catch (e) { if (!(e instanceof ApiError) || e.status !== 401) toast(e.message); }
  finally { btn.disabled = false; btn.classList.remove("busy"); }
}

/* ---------- dialog ---------- */
function dialog(opts){
  const dlg = $("#dlg");
  dlg.className = opts.wide ? "wide" : "";
  $("#dlgTitle").textContent = opts.title;
  $("#dlgBody").innerHTML = opts.html;
  const foot = $("#dlgFoot"); foot.innerHTML = "";
  (opts.actions || []).forEach(a => {
    const b = document.createElement("button");
    b.className = "btn " + (a.kind || ""); b.textContent = a.label;
    if (a.id) b.id = a.id;
    if (a.disabled) b.disabled = true;
    b.addEventListener("click", () => a.onClick(b));
    foot.appendChild(b);
  });
  const c = document.createElement("button");
  c.className = "btn ghost"; c.textContent = opts.closeLabel || "Close";
  c.addEventListener("click", () => dlg.close());
  foot.appendChild(c);
  if (!dlg.open) dlg.showModal();
  return dlg;
}

/* ---------- shared renderers ---------- */
function healthPill(t){
  const h = t.health || "unknown";
  const cls = h === "ok" ? "ok" : h === "error" ? "bad" : "idle";
  return '<span class="pill ' + cls + '" title="' + esc(t.health_detail || "") + '">' + esc(h) + "</span>";
}
function statePill(s){
  const cls = (s === "completed" || s === "done" || s === "ready") ? "ok" : (s === "running" || s === "claimed") ? "info" : (s === "pending" || s === "free") ? "idle"
    : (s === "stopped" || s === "lost") ? "warn" : "bad";
  const dot = s === "running" ? '<span class="dot run"></span>' : "";
  return '<span class="pill ' + cls + '">' + dot + esc(s || "unknown") + "</span>";
}
function fillBar(pct){
  if (num(pct)) return "";
  const cls = pct >= 95 ? "bad" : pct >= 80 ? "warn" : "";
  return '<div class="bar"><i class="' + cls + '" style="width:' + Math.max(0, Math.min(100, pct)) + '%"></i></div>';
}
function cacheLine(c){
  if (!c) return '<span class="muted">no cache information</span>';
  if (c.available === false) return '<span class="muted">SmartStore cache not reported: ' + esc(c.reason || "no reason given") + "</span>";
  return '<span class="mono">' + fmtInt(c.local_buckets) + "/" + fmtInt(c.total_buckets) +
    " buckets local (" + fmtPct(c.local_pct, 0) + "), " + fmtBytes(c.local_bytes) + " of " +
    (num(c.max_cache_size_mb) ? fmtBytes(c.total_bytes) : fmtBytes(c.max_cache_size_mb * 1024 * 1024)) +
    ", " + fmtPct(c.fill_pct, 0) + " full, policy " + esc(c.eviction_policy || "unknown") + "</span>";
}
function cacheHtml(c){
  if (!c) return "<p>No cache information was returned.</p>";
  if (c.available === false)
    return '<p class="muted">This target does not report a SmartStore cache: ' + esc(c.reason || "no reason given") +
      ". That is normal on an indexer with local storage only.</p>";
  const rows = Object.entries(c.per_index || {}).map(([n, v]) =>
    "<tr><td class='mono'>" + esc(n) + "</td><td class='num'>" + fmtInt(v.local_buckets) + "</td><td class='num'>" +
    fmtInt(v.remote_buckets) + "</td><td class='num'>" + fmtPct(v.local_pct, 0) + "</td><td class='num'>" +
    fmtBytes(v.local_bytes) + "</td></tr>").join("");
  return "<dl class='kv'>" +
    "<dt>Local buckets</dt><dd>" + fmtInt(c.local_buckets) + "</dd>" +
    "<dt>Remote buckets</dt><dd>" + fmtInt(c.remote_buckets) + "</dd>" +
    "<dt>Total buckets</dt><dd>" + fmtInt(c.total_buckets) + " (" + fmtPct(c.local_pct, 0) + " local)</dd>" +
    "<dt>Local bytes</dt><dd>" + fmtBytes(c.local_bytes) + " of " + fmtBytes(c.total_bytes) + "</dd>" +
    "<dt>Cache ceiling</dt><dd>" + (num(c.max_cache_size_mb) ? "unset" : fmtBytes(c.max_cache_size_mb * 1024 * 1024)) + "</dd>" +
    "<dt>Eviction policy</dt><dd>" + esc(c.eviction_policy || "unknown") + "</dd></dl>" +
    "<h3>Fill against the ceiling: " + fmtPct(c.fill_pct, 0) + "</h3>" + fillBar(c.fill_pct) +
    (c.fill_pct >= 95 ? '<p class="note">A cache at its ceiling evicts buckets other searches are using, so a run measures churn as much as search.</p>' : "") +
    "<h3>Per index</h3>" + (rows ? "<div class='scroll'><table><thead><tr><th>Index</th><th class='num'>Local</th>" +
      "<th class='num'>Remote</th><th class='num'>Local %</th><th class='num'>Local bytes</th></tr></thead><tbody>" +
      rows + "</tbody></table></div>" : "<p class='muted'>No per-index breakdown was returned.</p>");
}

/* ---------- targets ---------- */
async function viewTargets(){
  setView(
    '<div class="head"><h1>Targets</h1><div class="btns">' +
    '<button class="btn" data-act="toggle-add">Add target</button>' +
    '<button class="btn primary" data-act="launch">Launch a run</button></div></div>' +
    '<section class="panel hidden" id="addPanel">' +
    '<h2>Add a target</h2>' +
    '<p class="note">A bearer token is preferred over a username and password: it can be scoped, revoked and never puts an account password in the store. Fill in either the token or both credential fields.</p>' +
    '<form id="addForm"><div class="grid2">' +
    '<label class="f"><span>Name</span><input type="text" name="name" required></label>' +
    '<label class="f"><span>Management URL (splunkd, usually :8089)</span><input type="text" name="mgmt_url" placeholder="https://splunk.example:8089" required></label>' +
    '<label class="f"><span>Web URL (optional)</span><input type="text" name="web_url" placeholder="https://splunk.example:8000"></label>' +
    '<label class="f"><span>Bearer token (preferred)</span><input type="password" name="token" autocomplete="off"></label>' +
    '<label class="f"><span>Username (only without a token)</span><input type="text" name="username" autocomplete="off"></label>' +
    '<label class="f"><span>Password (only without a token)</span><input type="password" name="password" autocomplete="new-password"></label>' +
    '<label class="f"><span>App context</span><input type="text" name="app" placeholder="search"></label>' +
    '<label class="f"><span>Owner</span><input type="text" name="owner" placeholder="nobody"></label>' +
    '<label class="f"><span>API version (optional)</span><input type="text" name="api_version"></label>' +
    '</div>' +
    '<h3>Indexers, for SmartStore (optional)</h3>' +
    '<p class="note">The cache lives on the indexers. Against a search head, list their management URLs (or leave empty to discover the search peers) and, if the search head\'s credential is not valid on them, a credential that is.</p>' +
    '<div class="grid2">' +
    '<label class="f"><span>Indexer management URLs, comma separated</span><input type="text" name="indexer_urls" placeholder="https://idx1:8089, https://idx2:8089"></label>' +
    '<label class="f"><span>Indexer bearer token</span><input type="password" name="indexer_token" autocomplete="off"></label>' +
    '<label class="f"><span>Indexer username</span><input type="text" name="indexer_username" autocomplete="off"></label>' +
    '<label class="f"><span>Indexer password</span><input type="password" name="indexer_password" autocomplete="new-password"></label>' +
    '</div><label class="chk"><input type="checkbox" name="verify_tls" checked> Verify TLS certificates</label>' +
    '<div class="btns"><button class="btn primary" type="submit">Create target</button>' +

const cssEsc = s => (window.CSS && CSS.escape) ? CSS.escape(String(s)) : String(s).replace(/["\\]/g, "\\$&");
async function onAddTarget(ev){
  ev.preventDefault();
  const f = ev.target, fd = new FormData(f);
  const body = { name: fd.get("name"), mgmt_url: fd.get("mgmt_url"), verify_tls: fd.get("verify_tls") === "on" };
  ["web_url", "token", "username", "password", "app", "owner", "api_version",
   "indexer_token", "indexer_username", "indexer_password"].forEach(k => {
    const v = (fd.get(k) || "").trim(); if (v) body[k] = v;
  });
  const idx = (fd.get("indexer_urls") || "").split(",").map(x => x.trim()).filter(Boolean);
  if (idx.length) body.indexer_urls = idx;
  const btn = f.querySelector('button[type=submit]');
  await busy(btn, async () => {
    await api("/targets", { method: "POST", body });

async function actTest(btn, id){
  await busy(btn, async () => {
    const r = await api("/targets/" + encodeURIComponent(id) + "/test", { method: "POST" });

    if (!cell) return;
    cell.classList.remove("hidden");
    const bits = [];
    if (r.version) bits.push("version " + esc(r.version));
    if (r.roles && r.roles.length) bits.push("roles " + esc(r.roles.join(", ")));
    if (!num(r.cores)) bits.push(esc(r.cores) + " cores");
    if (!num(r.max_hist_searches)) bits.push("ceiling " + esc(r.max_hist_searches) + " concurrent historical searches");
    cell.firstElementChild.innerHTML = r.ok
      ? '<span class="pill ok">\u2713 reachable</span> <span class="mono">' + bits.join(" \u00b7 ") + "</span>" +
        (r.detail ? ' <span class="muted">' + esc(r.detail) + "</span>" : "")
      : '<span class="pill bad">\u2717 failed</span> <span class="mono">' + esc(r.detail || "no detail given") + "</span>";

async function actEvict(btn, id){
  await busy(btn, async () => {

    const names = Object.keys((c && c.per_index) || {});
    const list = names.length

          esc(n) + '</span> <span class="muted small">' + fmtInt(c.per_index[n].local_buckets) + " local buckets, " +
          fmtBytes(c.per_index[n].local_bytes) + "</span></label>").join("")
      : '<p class="muted">This target reported no per-index cache breakdown, so pick "all indexes" or nothing.</p>';
    dialog({
      title: "Evict the SmartStore cache",
      html: '<div class="banner warn"><b>Read this before you tick anything</b>' +
        "Eviction does not destroy data: every bucket still exists in object storage. What it costs is time. " +
        "The next searches over that data have to re-download it, so they will be slow, and on a shared cluster " +
        "most of that cache belongs to other people's dashboards and scheduled searches, not to you. " +
        "There is no undo beyond waiting for everything to re-localise.</div>" +
        "<h3>Indexes</h3>" + list +
        '<h3>Or everything</h3><label class="chk"><input type="checkbox" id="evAll"> ' +
        '<b style="color:var(--bad)">All indexes</b> <span class="muted small">(drops the whole cache on this target)</span></label>' +
        '<div id="evResult"></div>',
      actions: [{ label: "Evict", kind: "danger", id: "evGo", disabled: true, onClick: b => doEvict(b, id) }]

      const any = Array.prototype.some.call(document.querySelectorAll(".evIdx"), i => i.checked);

async function doEvict(btn, id){

  const idx = Array.prototype.filter.call(document.querySelectorAll(".evIdx"), i => i.checked).map(i => i.value);
  await busy(btn, async () => {
    const r = await api("/targets/" + encodeURIComponent(id) + "/evict", {
      method: "POST", body: { indexes: idx, all_indexes: all }

      "<dt>Refused</dt><dd>" + fmtInt(e.failed) + " buckets</dd>" +
      "<dt>Local before</dt><dd>" + fmtInt(b.local_buckets) + " buckets, " + fmtBytes(b.local_bytes) + "</dd>" +
      "<dt>Local after</dt><dd>" + fmtInt(a.local_buckets) + " buckets, " + fmtBytes(a.local_bytes) + "</dd></dl>" +
      (e.failed ? '<p class="note">A bucket with a live reader cannot be evicted. Refusals are correct behaviour rather than a fault.</p>' : "");
    $("#evGo").disabled = true;
    toast("Evicted " + fmtInt(e.evicted) + " buckets", "ok");
  });
}

/* ---------- launch ---------- */
async function openLaunch(scenarioName){

  if (!state.targets.length) { toast("Add a target before launching a run"); location.hash = "#targets"; return; }
  if (!state.scenarios.length) { toast("This server has no scenarios registered, so there is nothing to run"); return; }
  const chosen = state.scenarios.find(x => x.name === scenarioName);
  if (chosen && chosen.runnable_here === false) { toast(chosen.not_runnable_reason); return; }
  let fleets = [];

  const fOpts = fleets.map(f => '<option value="' + esc(f.kind) + '"' + (f.available ? "" : " disabled") + (f.default && f.available ? " selected" : "") + ">" +
    esc(f.kind) + (f.available ? "" : " (unavailable)") + ": " + esc(f.detail) + "</option>").join("");

    (s.runnable_here === false ? " (not runnable here)" : "") + "</option>").join("");
  // The dialog is built from strings, then wired with real listeners below: no inline handlers.
  dialog({
    title: "Launch a run",
    html: '<div class="grid2">' +
      '<label class="f"><span>Target</span><select id="lqTarget">' + tOpts + "</select></label>" +
      '<label class="f"><span>Scenario</span><select id="lqScenario">' + sOpts + "</select></label>" +
      '<label class="f"><span>Label (optional)</span><input type="text" id="lqLabel" placeholder="baseline before the indexer change"></label>' +
      '<label class="f"><span>Virtual users (blank keeps the scenario default)</span><input type="number" id="lqVu" min="1"></label>' +
      '<label class="f"><span>Duration in seconds</span><input type="number" id="lqDur" min="1"></label>' +
      '<label class="f"><span>Pacing in seconds per iteration</span><input type="number" id="lqPace" min="0" step="0.1"></label>' +
      '<label class="f"><span>Arrival rate per minute (open model)</span><input type="number" id="lqRate" min="0" step="1"></label>' +
      '<label class="f"><span>Seed (blank keeps the scenario\'s, so runs stay comparable)</span><input type="number" id="lqSeed" min="1"></label>' +
      '<label class="f"><span>Fleet</span><select id="lqFleet">' + fOpts + "</select></label>" +

      "</div>" +

      '<label class="chk"><input type="checkbox" id="lqEvict"> Evict the SmartStore cache first (measures the cold path)</label>' +

async function onEvictToggle(){

  box.classList.remove("hidden");
  box.innerHTML = '<p class="muted small">Reading the cache\u2026</p>';

  try { c = await api("/targets/" + encodeURIComponent($("#lqTarget").value) + "/cache"); }
  catch (e) { if (e.status !== 401) toast(e.message); }
  const names = Object.keys((c && c.per_index) || {});
  box.innerHTML = '<div class="banner warn"><b>Eviction affects everyone on this target</b>' +
    "Nothing is destroyed, but the next searches over these indexes pay to re-download from object storage. " +
    "Leave the list empty to let the scenario's own corpus index decide.</div>" +
    (names.length ? names.map(n => '<label class="chk"><input type="checkbox" class="lqIdxChk" value="' + esc(n) +
      '"> <span class="mono">' + esc(n) + "</span></label>").join("")
      : '<p class="muted small">No per-index breakdown was returned for this target.</p>') +

}
async function submitLaunch(btn){
  // Target ids are integers on the wire, and a select always hands back a string.
  const rawId = $("#lqTarget").value;
  const body = { target_id: /^\d+$/.test(rawId) ? parseInt(rawId, 10) : rawId, scenario: $("#lqScenario").value };
  const opt = (id, key, asFloat) => {
    const v = ($("#" + id).value || "").trim();
    if (v !== "") body[key] = asFloat ? parseFloat(v) : parseInt(v, 10);
  };
  opt("lqVu", "virtual_users"); opt("lqDur", "duration_s", true);
  opt("lqPace", "pacing_s", true); opt("lqRate", "arrival_rate_per_min", true); opt("lqSeed", "seed"); opt("lqWorkers", "workers");
  const fleetSel = $("#lqFleet"); if (fleetSel && fleetSel.value) body.fleet = fleetSel.value;
  const label = ($("#lqLabel").value || "").trim();

  }
  await busy(btn, async () => {
    const run = await api("/runs", { method: "POST", body });
    $("#dlg").close();
    location.hash = "#run/" + encodeURIComponent(run.id);
  });
}

/* ---------- run detail ---------- */
function stopPolling(){ pollGeneration += 1; if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; } }
async function viewRun(id){
  if (samplesRunId !== id) { samples = []; samplesRunId = id; }
  state.currentRun = id;
  setView('<div id="runWrap" class="muted">Loading run\u2026</div>');
  await tickRun(id, pollGeneration);
}
async function tickRun(id, generation){
  let run;
  try { run = await api("/runs/" + encodeURIComponent(id)); }
  catch (e) {
    if (e.status === 401) return;
    // One transient failure must not end the live view for good: retry.
    if (generation === pollGeneration && state.currentRun === id) pollTimer = setTimeout(() => tickRun(id, generation), 5000);
    return;
  }
  if (generation !== pollGeneration || state.currentRun !== id) return;   // the user navigated away mid-request
  const live = run.state === "running" || run.state === "pending";
  if (live) {
    const st = run.stats || {}, lat = st.latency || {};
    const t = num(st.elapsed_s) ? samples.length * 2 : st.elapsed_s;
    const last = samples[samples.length - 1];
    if (!last || t > last.t) samples.push({ t: t, p50: lat.p50_ms, p95: lat.p95_ms });
    if (samples.length > 400) samples.shift();
  }
  drawRun(run);
  if (live) pollTimer = setTimeout(() => tickRun(id, generation), 2000);
}
function drawRun(r){
  const st = r.stats || {}, sm = r.summary || {}, lat = st.latency || {}, q = st.queueing || {};
  const tgt = st.target || {}, cache = sm.cache || {}, delta = cache.delta || {};
  const ceiling = tgt.max_hist_searches;
  const peak = st.peak_in_flight;
  const atCeiling = !num(peak) && !num(ceiling) && peak >= ceiling;
  const banners = [];
  if (sm.valid === false)
    banners.push('<div class="banner bad"><b>Invalid run: ' + esc(sm.invalid_reason || "reason not given") + "</b>" +
      "These numbers describe the load generator rather than Splunk. Do not compare them with other runs, and do not draw a capacity conclusion from them.</div>");
  if (!num(q.searches_queued) && q.searches_queued > 0)
    banners.push('<div class="banner warn"><b>Queueing observed: ' + fmtInt(q.searches_queued) + " of " + fmtInt(st.executions) +
      " searches (" + fmtPct(q.queued_pct) + ") waited in QUEUED before running, p95 " + fmtMs((q.queued_ms || {}).p95_ms) + "</b>" +
      "The target was at its concurrent-search ceiling. This is a finding, not an error: it is the moment a capacity test exists to find.</div>");
  const prov = delta.provenance;
  if (prov && prov !== "warm")
    banners.push('<div class="banner warn"><b>Cache provenance: ' + esc(prov) + "</b>" +
      fmtInt(delta.buckets_downloaded) + " buckets (" + fmtBytes(delta.bytes_downloaded) +
      ") came down from object storage during this run, so part of what was measured is object storage and the network rather than the search tier.</div>");
  const quiet = [];
  if (prov === "warm")
    quiet.push('<div class="note">Cache provenance: warm. Nothing was downloaded during the run, so these numbers describe the search tier.</div>');
  if (sm.co_corrected === false)
    quiet.push('<div class="note">Coordinated omission was not corrected: the latency percentiles are service times, so throughput is the signal to read.</div>');
  if (sm.self_instrumented)
    quiet.push('<div class="note">Self-instrumented: telemetry was written to the system under test, so the run added a little load to its own target.</div>');
  if (sm.abort_reason)
    banners.push('<div class="banner bad"><b>Aborted</b>' + esc(sm.abort_reason) + "</div>");
  if (r.error)
    banners.push('<div class="banner bad"><b>Error</b><span class="mono">' + esc(r.error) + "</span></div>");

  const tile = (k, v, sub, cls) => '<div class="tile ' + (cls || "") + '"><div class="k">' + k + '</div><div class="v">' + v +
    '</div>' + (sub ? '<div class="sub">' + sub + "</div>" : "") + "</div>";
  const errCls = num(st.error_rate_pct) ? "" : st.error_rate_pct >= 5 ? "bad" : st.error_rate_pct > 0 ? "warn" : "ok";
  const tiles = tile("Executions", fmtInt(st.executions), fmtInt(st.errors) + " errors") +
    tile("Throughput", fmtNum(st.throughput_per_s, 2), "searches per second") +
    tile("p50", fmtMs(lat.p50_ms), "n=" + fmtInt(lat.count)) +
    tile("p95", fmtMs(lat.p95_ms), "max " + fmtMs(lat.max_ms)) +
    tile("p99", fmtMs(lat.p99_ms), "mean " + fmtMs(lat.mean_ms)) +
    tile("Error rate", fmtPct(st.error_rate_pct), "", errCls) +
    tile("Peak in flight", fmtInt(peak) + (num(ceiling) ? "" : " / " + fmtInt(ceiling)),
      num(ceiling) ? "ceiling unknown" : "ceiling", atCeiling ? "bad" : "") +
    (st.partial ? tile("Partial", fmtInt(st.partial), "finished with less than asked", "warn") : "") +
    (st.abandoned ? tile("Abandoned", fmtInt(st.abandoned), "still running at the end", "warn") : "");
  if (st.partial)
    quiet.push('<div class="note">' + fmtInt(st.partial) + " search(es) finished DONE but reported incomplete results (a peer dropped out, a limit truncated them, or the dashboard did not honour the pinned time range). Their latency is real; their work was less than asked.</div>");
  if (st.abandoned)
    quiet.push('<div class="note">' + fmtInt(st.abandoned) + " search(es) were still in flight when the run ended and are recorded as cancelled failures with the time they had accrued, so the tail is a floor rather than a measurement.</div>");

  // Per class: which part of the stack moved. The classes stress different
  // components, and a p95 over all of them hides which one got slower.
  const byClass = {};
  (st.steps || []).forEach(sx => {
    const k = sx.class || "unclassified";
    const b = byClass[k] || (byClass[k] = { execs: 0, errors: 0, worst: null, steps: 0 });
    b.execs += sx.executions || 0; b.errors += sx.errors || 0; b.steps += 1;
    const p = (sx.latency || {}).p95_ms;
    if (!num(p) && (b.worst === null || p > b.worst)) b.worst = p;
  });
  const classRows = Object.keys(byClass).sort().map(k => {
    const b = byClass[k];
    return "<tr><td><span class='tag'>" + esc(k) + "</span></td><td class='num'>" + fmtInt(b.steps) + "</td><td class='num'>" + fmtInt(b.execs) +
      "</td><td class='num'>" + fmtPct(b.execs ? 100 * b.errors / b.execs : null) + "</td><td class='num'>" + fmtMs(b.worst) + "</td></tr>";
  }).join("");

  const steps = (st.steps || []).slice().sort((a, b) =>
    ((b.latency || {}).p95_ms || 0) - ((a.latency || {}).p95_ms || 0));
  const stepRows = steps.map(s => {
    const l = s.latency || {}, d = s.dispatch || {}, f = s.ttfr || {};
    return "<tr><td class='mono'>" + esc(s.step_id) + "</td><td><span class='tag'>" + esc(s.class || "?") + "</span></td>" +
      "<td class='num'>" + fmtInt(s.executions) + "</td><td class='num'>" + fmtInt(s.errors) + "</td>" +
      "<td class='num'>" + fmtPct(s.error_rate_pct) + "</td><td class='num'>" + fmtMs(l.p50_ms) + "</td>" +
      "<td class='num'>" + fmtMs(l.p95_ms) + "</td><td class='num'>" + fmtMs(d.p95_ms) + "</td>" +
      "<td class='num'>" + fmtMs(f.p95_ms) + "</td><td class='num'>" + fmtInt(s.scan_count_total) + "</td>" +
      "<td class='num'>" + fmtInt(s.mean_events_per_s) + "</td></tr>";
  }).join("");

  const live = r.state === "running" || r.state === "pending";
  const elapsed = num(st.elapsed_s) ? null : st.elapsed_s;
  const html =
    '<div class="head"><div><h1>' + esc(r.label || r.scenario || "Run") + " " + statePill(r.state) + "</h1>" +
    '<div class="muted small mono">' + esc(r.scenario || "") + " against " + esc(r.target_name || r.target_id || "?") +
    " \u00b7 id " + esc(r.id) + " \u00b7 started " + fmtWhen(r.started_at || r.created_at) +
    (elapsed === null ? "" : " \u00b7 elapsed " + fmtDur(elapsed)) +
    (sm.outcome ? " \u00b7 outcome " + esc(sm.outcome) : "") +
    (sm.load_model ? " \u00b7 " + esc(sm.load_model) + " model" : "") +
    (num(sm.effective_seed) ? "" : " \u00b7 seed " + esc(sm.effective_seed)) +
    (sm.scenario_digest ? " \u00b7 digest " + esc(sm.scenario_digest) : "") + "</div></div>" +
    '<div class="btns"><a class="btn" href="#runs">All runs</a>' +
    (live ? '<button class="btn danger" data-act="stop-run" data-id="' + esc(r.id) + '">Stop</button>'
      : (r.state === "completed" ? '<button class="btn" data-act="promote" data-id="' + esc(r.id) + '">Make baseline</button>' +
        '<button class="btn" data-act="compare" data-id="' + esc(r.id) + '">Compare</button>' : "")) +
    '<button class="btn" data-act="copy-summary">Copy JSON</button></div></div>' +
    banners.join("") + quiet.join("") +
    '<div class="tiles">' + tiles + "</div>" +
    (num(sm.peak_virtual_users) ? "" : '<div class="note">Peak virtual users: ' + fmtInt(sm.peak_virtual_users) +
      ". Virtual users are not concurrent searches: a user idles between iterations, so the in-flight figure is the one to compare against the ceiling.</div>") +
    '<div class="chart"><h3 style="margin-top:0">Latency over the run</h3>' + chartSvg(live) + "</div>" +
    (classRows ? '<div class="panel" style="padding:0"><table><thead><tr><th>Class</th><th class="num">Steps</th><th class="num">Execs</th><th class="num">Err %</th><th class="num">Worst p95</th></tr></thead><tbody>' + classRows + "</tbody></table></div>" : "") +
    workersSection(r, st, sm) +
    '<div id="compareBox"></div>' +
    sutSection(sm.sut) +
    "<h3>Steps, worst p95 first</h3>" +
    (stepRows ? '<div class="panel scroll" style="padding:0"><table><thead><tr><th>Step</th><th>Class</th>' +
      "<th class='num'>Execs</th><th class='num'>Errors</th><th class='num'>Err %</th><th class='num'>p50</th>" +
      "<th class='num'>p95</th><th class='num'>Dispatch p95</th><th class='num'>TTFR p95</th>" +
      "<th class='num'>Scanned</th><th class='num'>Events/s</th></tr></thead><tbody>" + stepRows + "</tbody></table></div>"
      : '<div class="panel"><p class="muted">No per-step figures yet.</p></div>');
  const wrap = $("#runWrap");
  if (wrap) wrap.outerHTML = '<div id="runWrap">' + html + "</div>";
  else if ($("#view")) $("#view").innerHTML = '<div id="runWrap">' + html + "</div>";
  state.lastJson = JSON.stringify(sm && Object.keys(sm).length ? sm : r, null, 2);
}

/* ---------- baselines and comparison ---------- */
async function actPromote(btn, id){
  dialog({
    title: "Make this run a baseline",
    html: '<p class="note">A baseline is a label pointing at a run. A pipeline compares against the label, so promoting a newer run moves it without touching the pipeline.</p>' +
      '<label class="f"><span>Label</span><input type="text" id="blLabel" placeholder="main-green"></label>' +
      '<label class="f"><span>Note (optional)</span><input type="text" id="blNote"></label>',
    actions: [{ label: "Promote", kind: "primary", onClick: async b => {
      await busy(b, async () => {
        const label = ($("#blLabel").value || "").trim();
        if (!label) { toast("Give the baseline a label"); return; }
        await api("/baselines", { method: "POST", body: { run_id: parseInt(id, 10), label, note: ($("#blNote").value || "").trim() || null } });
        $("#dlg").close(); toast("Baseline " + label + " now points at run " + id, "ok");
      });
    }}]
  });
}
async function actCompare(btn, id){
  let baselines = [];
  try { baselines = (await api("/baselines")) || []; } catch (e) { if (e.status !== 401) toast(e.message); }
  const opts = baselines.map(b => '<option value="' + esc(b.label) + '">' + esc(b.label) + " (run " + esc(b.run_id) + ", " + esc(b.scenario) + ")</option>").join("");
  dialog({
    title: "Compare run " + id + " against a baseline",
    html: (opts ? '<label class="f"><span>Baseline</span><select id="cmpLabel">' + opts + "</select></label>"
      : '<p class="muted">No baselines yet. Make one from a completed run first, or compare against absolute gates only.</p>') +
      '<label class="f"><span>Gates, one per line (blank reports without judging)</span><textarea id="cmpGates" rows="4" spellcheck="false">p95 <= baseline + 15%\nerror_rate <= 2%\nqueued == 0\nvalid</textarea></label>',
    actions: [{ label: "Compare", kind: "primary", onClick: async b => {
      await busy(b, async () => {
        const gates = ($("#cmpGates").value || "").split("\n").map(x => x.trim()).filter(Boolean);
        const body = { gates };
        const sel = $("#cmpLabel"); if (sel && sel.value) body.baseline_label = sel.value;
        const r = await api("/runs/" + encodeURIComponent(id) + "/compare", { method: "POST", body });
        $("#dlg").close();
        renderComparison(r);
      });
    }}]
  });
}
function renderComparison(c){
  const box = $("#compareBox"); if (!box) return;
  const gates = (c.gates || []).map(g => "<tr><td class='mono'>" + esc(g.gate) + "</td><td>" + (g.passed ? '<span class="pill ok">ok</span>' : '<span class="pill bad">FAIL</span>') +
    "</td><td class='small'>" + esc(g.detail) + "</td></tr>").join("");
  const steps = (c.steps || []).filter(sx => !num(sx.candidate_p95_ms) && !num(sx.baseline_p95_ms)).sort((a, b) => (b.delta_pct || 0) - (a.delta_pct || 0)).map(sx =>
    "<tr><td class='mono'>" + esc(sx.step_id) + "</td><td class='num'>" + fmtMs(sx.baseline_p95_ms) + "</td><td class='num'>" + fmtMs(sx.candidate_p95_ms) +
    "</td><td class='num'>" + (num(sx.delta_pct) ? "\u2013" : (sx.delta_pct > 0 ? "+" : "") + fmtNum(sx.delta_pct, 1) + "%") +
    "</td><td>" + (sx.scanned_more ? '<span class="pill warn">scanned more</span> ' : "") + (sx.too_few_samples ? '<span class="pill idle">few samples</span>' : "") + "</td></tr>").join("");
  box.innerHTML = '<div class="panel"><h3 style="margin-top:0">Comparison' + (c.baseline_run_id ? " against run " + esc(c.baseline_run_id) : "") + "</h3>" +
    (c.blocked ? '<div class="banner bad"><b>Blocked</b>' + esc(c.blocked) + "</div>" :
      ((c.gates || []).length ? '<div class="banner ' + (c.ok ? "info" : "bad") + '"><b>' + (c.ok ? "Every gate met" : "A gate was breached") + "</b></div>"
        : '<div class="banner info"><b>Report only</b>No gates were given, so nothing was judged.</div>')) +
    (c.warnings || []).map(w => '<div class="note">' + esc(w) + "</div>").join("") +
    (gates ? "<table><thead><tr><th>Gate</th><th></th><th>Detail</th></tr></thead><tbody>" + gates + "</tbody></table>" : "") +
    (steps ? "<h3>Per step, p95</h3><div class='scroll'><table><thead><tr><th>Step</th><th class='num'>Baseline</th><th class='num'>Candidate</th><th class='num'>Delta</th><th></th></tr></thead><tbody>" + steps + "</tbody></table></div>" : "") +
    "</div>";
  box.scrollIntoView({ behavior: "smooth", block: "start" });
}
async function viewBaselines(){
  setView('<div class="head"><h1>Baselines</h1></div><p class="note">A label a pipeline compares against. Promote a completed run from its detail page.</p><div id="blBody" class="muted">Loading\u2026</div>');
  let list;
  try { list = await api("/baselines"); }
  catch (e) { if (e.status !== 401) { $("#blBody").innerHTML = '<p class="muted">' + esc(e.message) + "</p>"; } return; }
  const rows = (list || []).map(b => "<tr><td class='mono'>" + esc(b.label) + "</td><td class='clickable mono' data-run='" + esc(b.run_id) + "'>run " + esc(b.run_id) + "</td><td class='mono'>" + esc(b.scenario) +
    "</td><td>" + fmtWhen(b.created_at) + "</td><td>" + esc(b.note || "") + "</td><td><button class='btn danger' data-act='delete-baseline' data-label='" + esc(b.label) + "'>Delete</button></td></tr>").join("");
  $("#blBody").innerHTML = rows ? '<div class="panel scroll" style="padding:0"><table><thead><tr><th>Label</th><th>Run</th><th>Scenario</th><th>Made</th><th>Note</th><th></th></tr></thead><tbody>' + rows + "</tbody></table></div>"
    : '<div class="panel"><p class="muted">No baselines yet.</p></div>';
}
async function viewAudit(){
  setView('<div class="head"><h1>Audit</h1></div><p class="note">Who did what: logins, launches, stops, evictions and scenario changes, with the caller\'s address and how they authenticated.</p><div id="auBody" class="muted">Loading\u2026</div>');
  let r;
  try { r = await api("/audit"); }
  catch (e) { if (e.status !== 401) { $("#auBody").innerHTML = '<p class="muted">' + esc(e.message) + "</p>"; } return; }
  const rows = ((r && r.events) || []).map(e => "<tr><td>" + fmtWhen(e.at) + "</td><td class='mono'>" + esc(e.action) + "</td><td>" + esc(e.actor) + "</td><td class='mono'>" + esc(e.client || "") +
    "</td><td>" + (num(e.target_id) ? "" : "target " + esc(e.target_id)) + "</td><td class='small'>" + esc(e.detail || "") + "</td></tr>").join("");
  $("#auBody").innerHTML = rows ? '<div class="panel scroll" style="padding:0"><table><thead><tr><th>When</th><th>Action</th><th>Actor</th><th>From</th><th>Target</th><th>Detail</th></tr></thead><tbody>' + rows + "</tbody></table></div>"
    : '<div class="panel"><p class="muted">Nothing recorded yet.</p></div>';
}
// A fleet run's workers: who holds which slot, what it has done, when it last
// spoke. A slot that went quiet is the first thing to look at when a fleet run
// is marked invalid.
function workersSection(r, st, sm){
  if (!r.fleet || r.fleet === "inprocess") return "";
  const live = st.workers || [];
  const finalRows = (sm.workers || []);
  const rows = (live.length ? live : finalRows).map(w =>
    "<tr><td class='num'>" + esc(w.slot) + "</td><td class='mono'>" + esc(w.engine || "") + "</td><td>" + statePill(w.state || w.outcome || "") +
    "</td><td class='mono'>" + esc(w.holder || "") + "</td><td class='num'>" + fmtInt(w.executions) + "</td><td class='num'>" + fmtInt(w.errors) +
    "</td><td class='num'>" + fmtMs(w.p95_ms) + "</td><td>" + (w.last_heartbeat_at ? fmtWhen(w.last_heartbeat_at) : "") +
    (w.restarts ? ' <span class="pill warn">' + esc(w.restarts) + " restart(s)</span>" : "") + "</td></tr>").join("");
  const note = st.latency_note ? '<p class="muted small">' + esc(st.latency_note) + "</p>" : "";
  return '<div class="panel"><h3 style="margin-top:0">Workers (' + esc(r.fleet) + (r.fleet_state ? ", " + esc(r.fleet_state) : "") + ")</h3>" + note +
    (rows ? '<div class="scroll"><table><thead><tr><th class="num">Slot</th><th>Engine</th><th>State</th><th>Holder</th><th class="num">Execs</th><th class="num">Errors</th><th class="num">p95</th><th>Last heartbeat</th></tr></thead><tbody>' + rows + "</tbody></table></div>"
      : '<p class="muted">No worker has claimed a slot yet.</p>') +
    '<div class="btns" style="margin-top:8px"><button class="btn" data-act="fleet-logs" data-id="' + esc(r.id) + '">Worker logs</button></div></div>';
}
async function actFleetLogs(btn, id){
  await busy(btn, async () => {
    const r = await api("/runs/" + encodeURIComponent(id) + "/logs?tail=300");
    const chunks = (r.chunks || []).map(c => "<h3>" + esc(c.group) + " (" + esc(c.kind) + " " + esc(c.id) + ")</h3><pre class='mono small' style='white-space:pre-wrap;max-height:320px;overflow:auto;background:var(--bg);padding:8px;border:1px solid var(--line);border-radius:4px'>" + esc(c.text || "(nothing)") + "</pre>").join("");
    dialog({ title: "Worker logs for run " + id, wide: true, html: chunks || "<p class='muted'>No logs were available.</p>" });
  });
}
// What the cluster itself said about the run. This is the half no client-side
// timing can produce: whether the time went to the indexers, whether somebody
// else's scheduled searches were skipped to make room, and how hot the box got.
function sutSection(sut){
  if (!sut) return "";
  const findings = (sut.findings || []).map(f => "<li>" + esc(f) + "</li>").join("");
  const probes = sut.probes || {};
  const rows = Object.keys(probes).map(name => {
    const p = probes[name] || {};
    const state = p.available
      ? (p.rows && p.rows.length ? fmtInt(p.rows.length) + " row(s)" : "no matching events")
      : "unavailable";
    return "<tr><td class='mono'>" + esc(name) + "</td><td>" + esc(state) + "</td>" +
      "<td class='muted small'>" + esc(p.available ? (p.description || "") : (p.reason || "")) + "</td></tr>";
  }).join("");

  return '<div class="panel" style="margin-top:14px"><h3 style="margin-top:0">What the cluster said</h3>' +
    (findings
      ? '<ul style="margin:0 0 10px;padding-left:18px">' + findings + "</ul>"
      : '<p class="muted">No server-side correlation was available.</p>') +
    (rows ? "<table><thead><tr><th>Probe</th><th>Result</th><th>Detail</th></tr></thead><tbody>" +
      rows + "</tbody></table>" : "") +
    '<p class="muted small" style="margin-bottom:0">These searches ran on the target after the load ' +
    "stopped, so they add a small, known amount of work to the system being measured.</p></div>";
}

// A deliberately small inline SVG line chart: no library, no external request.
function chartSvg(live){
  const pts = samples.filter(s => !num(s.p95) || !num(s.p50));
  if (pts.length < 2)
    return '<p class="muted small">' + (live
      ? "The chart appears once two samples have been collected (one every two seconds)."
      : "No live samples: this run was not open in the browser while it was running, so only the final figures above are available.") + "</p>";
  const W = 600, H = 200, L = 56, R = 12, T = 12, B = 28;
  const maxT = Math.max.apply(null, pts.map(s => s.t).concat([1]));
  const rawMax = Math.max.apply(null, pts.map(s => Math.max(s.p50 || 0, s.p95 || 0)).concat([1]));
  const maxY = niceMax(rawMax);
  const x = t => L + (t / maxT) * (W - L - R);
  const y = v => H - B - (Math.min(v, maxY) / maxY) * (H - T - B);
  const poly = key => pts.filter(s => !num(s[key])).map(s => x(s.t).toFixed(1) + "," + y(s[key]).toFixed(1)).join(" ");
  let grid = "";
  for (let i = 0; i <= 4; i++) {
    const v = maxY * i / 4, yy = y(v);
    grid += '<line x1="' + L + '" y1="' + yy.toFixed(1) + '" x2="' + (W - R) + '" y2="' + yy.toFixed(1) +
      '" stroke="currentColor" stroke-opacity=".14"/>' +
      '<text x="' + (L - 6) + '" y="' + (yy + 3.5).toFixed(1) + '" text-anchor="end" font-size="10" fill="currentColor" opacity=".6">' +
      Math.round(v).toLocaleString("en-GB") + "</text>";
  }
  for (let i = 0; i <= 5; i++) {
    const t = maxT * i / 5, xx = x(t);
    grid += '<text x="' + xx.toFixed(1) + '" y="' + (H - B + 15) + '" text-anchor="middle" font-size="10" fill="currentColor" opacity=".6">' +
      Math.round(t) + "s</text>";
  }
  return '<svg viewBox="0 0 ' + W + " " + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="Latency over the run">' +
    grid +
    '<line x1="' + L + '" y1="' + T + '" x2="' + L + '" y2="' + (H - B) + '" stroke="currentColor" stroke-opacity=".35"/>' +
    '<line x1="' + L + '" y1="' + (H - B) + '" x2="' + (W - R) + '" y2="' + (H - B) + '" stroke="currentColor" stroke-opacity=".35"/>' +
    '<polyline fill="none" stroke="var(--accent)" stroke-width="1.6" points="' + poly("p50") + '"/>' +
    '<polyline fill="none" stroke="var(--warn)" stroke-width="1.6" points="' + poly("p95") + '"/>' +
    '<text x="' + (L + 4) + '" y="' + (T + 10) + '" font-size="10" fill="var(--accent)">p50</text>' +
    '<text x="' + (L + 34) + '" y="' + (T + 10) + '" font-size="10" fill="var(--warn)">p95</text>' +
    '<text x="12" y="' + (T + 4) + '" font-size="10" fill="currentColor" opacity=".6">ms</text>' +
    "</svg>";
}
function niceMax(v){
  const mag = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / mag;
  const step = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
  return step * mag;
}
async function actStop(btn, id){
  await busy(btn, async () => {
    const r = await api("/runs/" + encodeURIComponent(id) + "/stop", { method: "POST" });
    toast("Stop requested", "ok");
    drawRun(r);
  });
}

/* ---------- routing ---------- */
function route(){ return (location.hash || "").replace(/^#/, "") || "targets"; }
function setView(html){ $("#view").innerHTML = html; }
async function render(){
  stopPolling();
  const r = route();
  if (r.indexOf("run/") !== 0) state.currentRun = null;
  document.querySelectorAll("nav a.navlink").forEach(a =>
    a.classList.toggle("active", a.dataset.route === r || (r.indexOf("run/") === 0 && a.dataset.route === "runs")));
  try {
    // Run ids travel through the hash encoded, so decode before using them as an id.
    if (r.indexOf("run/") === 0) await viewRun(decodeURIComponent(r.slice(4)));
    else if (r === "scenarios") await viewScenarios();
    else if (r === "runs") await viewRuns();
    else if (r === "baselines") await viewBaselines();
    else if (r === "audit") await viewAudit();
    else await viewTargets();
  } catch (e) {
    if (!(e instanceof ApiError) || e.status !== 401) { toast(e.message); console.error(e); }
  }
}

/* ---------- auth ---------- */
function showLogin(note){
  stopPolling();
  $("#app").classList.add("hidden");
  $("#login").classList.remove("hidden");
  const n = $("#loginNote");
  if (note) { n.textContent = note; n.classList.remove("hidden"); } else { n.classList.add("hidden"); }
  $("#loginPw").focus();
}
function showApp(){
  $("#login").classList.add("hidden");
  $("#app").classList.remove("hidden");
  // setup_needed means no password is configured at all, so the server lets
  // everyone in. Say that out loud rather than looking like a locked door.
  $("#openBanner").innerHTML = state.setupNeeded
    ? '<div class="banner bad"><b>This control plane has no password</b>' +
      "Anyone who can reach it can add targets, read their reports and drive load at your cluster. " +
      "Set an admin password in the server configuration and restart.</div>"
    : "";
  $("#logoutBtn").classList.toggle("hidden", !!state.setupNeeded);
  render();
}
async function boot(){
  let s = null;
  try { s = await api("/auth/status"); }
  catch (e) { if (e.status === 401) return; toast(e.message); }
  state.setupNeeded = !!(s && s.setup_needed);
  if (s && s.authenticated) showApp();
  else showLogin(null);
}

/* ---------- wiring ---------- */
$("#loginForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const btn = $("#loginBtn");
  await busy(btn, async () => {
    try {
      await api("/auth/login", { method: "POST", body: { password: $("#loginPw").value } });
    } catch (e) {
      if (e.status === 401) { toast("That password was not accepted"); return; }
      throw e;
    }
    $("#loginPw").value = "";
    state.targets = []; state.scenarios = [];
    showApp();
  });
});
const actions = {
  "toggle-add": () => $("#addPanel").classList.toggle("hidden"),
  "test": (b, el) => actTest(b, el.dataset.id),
  "report": (b, el) => actReport(b, el.dataset.id),
  "cache": (b, el) => actCache(b, el.dataset.id),
  "evict": (b, el) => actEvict(b, el.dataset.id),
  "delete": (b, el) => actDelete(b, el.dataset.id),
  "launch": () => openLaunch(null),
  "run-scenario": (b, el) => openLaunch(el.dataset.scenario),
  "scenario-detail": (b, el) => viewScenarioDetail(el.dataset.scenario),
  "import": () => openImport("", "imported"),
  "saved": (b, el) => actSaved(b, el.dataset.id),
  "stop-run": (b, el) => actStop(b, el.dataset.id),
  "promote": (b, el) => actPromote(b, el.dataset.id),
  "compare": (b, el) => actCompare(b, el.dataset.id),
  "copy-summary": b => copyLastJson(b),
  "fleet-logs": (b, el) => actFleetLogs(b, el.dataset.id),
  "delete-baseline": async (b, el) => {
    await busy(b, async () => { await api("/baselines/" + encodeURIComponent(el.dataset.label), { method: "DELETE" }); toast("Baseline deleted", "ok"); render(); });
  },
  "logout": async b => {
    await busy(b, async () => { try { await api("/auth/logout", { method: "POST" }); } catch (e) {} showLogin(); });
  }
};
// One delegated listener: no inline handlers anywhere, so a strict CSP is fine.
document.addEventListener("click", ev => {
  const el = ev.target.closest ? ev.target.closest("[data-act]") : null;
  if (el && actions[el.dataset.act]) { ev.preventDefault(); actions[el.dataset.act](el, el); return; }
  const row = ev.target.closest ? ev.target.closest("tr[data-run]") : null;
  if (row && !ev.target.closest("button, a")) location.hash = "#run/" + encodeURIComponent(row.dataset.run);
});
window.addEventListener("hashchange", () => { if (!$("#app").classList.contains("hidden")) render(); });
boot();
</script>
