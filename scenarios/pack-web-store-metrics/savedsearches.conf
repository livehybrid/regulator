# Regulator scenario pack-web-store-metrics: searches written against the Stoker pack 'web-store-metrics' (sourcetype stoker:metric).
# Plain savedsearches.conf: drop it into an app's local/ directory and Splunk will
# schedule these searches itself. The classes Regulator uses are in scenario.yaml.
# Generated by tools/build_pack_scenarios.py; edit that file rather than this one.

[Store requests by service]
search = | mstats sum(store.requests) as requests WHERE index=stoker_metrics span=1m BY service, region
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Store errors]
search = | mstats sum(store.errors) as errors WHERE index=stoker_metrics span=5m BY service | where errors > 0
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Checkout latency]
search = | mstats avg(store.checkout.latency.ms) as latency WHERE index=stoker_metrics span=5m BY region
dispatch.earliest_time = -2h
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Host CPU behind the store]
search = | mstats max(host.cpu.usage) as cpu WHERE index=stoker_metrics span=10m BY service
dispatch.earliest_time = -6h
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Daily requests by region]
search = | mstats sum(store.requests) as requests WHERE index=stoker_metrics span=1h BY region
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
cron_schedule = 0 6 * * *
enableSched = 1
request.ui_dispatch_app = search
