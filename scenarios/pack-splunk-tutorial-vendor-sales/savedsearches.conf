# Regulator scenario pack-splunk-tutorial-vendor-sales: searches written against the Stoker pack 'splunk-tutorial-vendor-sales' (sourcetype vendor_sales).
# Plain savedsearches.conf: drop it into an app's local/ directory and Splunk will
# schedule these searches itself. The classes Regulator uses are in scenario.yaml.
# Generated by tools/build_pack_scenarios.py; edit that file rather than this one.

[Sales by product code]
search = index=main sourcetype=vendor_sales | stats count by Code | sort - count
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Top vendors]
search = index=main sourcetype=vendor_sales | stats count by VendorID | sort - count | head 20
dispatch.earliest_time = -60m@m
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Distinct accounts buying]
search = index=main sourcetype=vendor_sales | stats dc(AcctID) as accounts, count as sales
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Sales from the highest vendor ids]
search = index=main sourcetype=vendor_sales VendorID>=9990 | table _time, VendorID, Code, AcctID
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Vendors above the average]
search = index=main sourcetype=vendor_sales | stats count by VendorID | eventstats avg(count) as mean | where count > mean | sort - count | head 50
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
cron_schedule = 0 6 * * *
enableSched = 1
request.ui_dispatch_app = search

[Sales per hour]
search = index=main sourcetype=vendor_sales | timechart span=1h count by Code
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
cron_schedule = 0 7 * * *
enableSched = 1
request.ui_dispatch_app = search
