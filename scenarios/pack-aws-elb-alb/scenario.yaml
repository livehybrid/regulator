# Generated by tools/build_pack_scenarios.py from the Stoker pack 'aws-elb-alb'.
#
# The searches live in savedsearches.conf next to this file, in Splunk's own
# format, so the same file can be installed into a Splunk app and scheduled by
# Splunk itself. This file says how Regulator applies them as load: which class
# each belongs to, how the population behaves and how hard to push.
#
# Two ways to run it. As shipped, a closed population of virtual users draws
# one search per iteration, weighted by how often each is scheduled. Change
# load.model to `schedule` (see scenarios/stoker-scheduler) and every search
# fires on its own cron instead, which is what Splunk's scheduler would do.
name: pack-aws-elb-alb
engine: api
seed: 1105
description: 'Application Load Balancer access logs: status mix per minute, 5xx by target, target latency
  percentiles, traffic by host and client top talkers'
tags:
- stoker-pack
- aws-elb-alb
- aws
- alb
- loadbalancer
corpus:
  requires_packs:
  - aws-elb-alb
  index: main
  sourcetypes:
  - aws:elb:accesslogs
time_policy:
  mode: rolling
  window: 24h
  jitter: 30m
  align: 1m
searches:
  file: savedsearches.conf
  only_enabled: true
  time_from_saved: derived
  classes:
    ALB status codes per minute: dense
    ALB 5xx by target: sparse
    Target latency percentiles by URL: dense
    Traffic by host: dense
    Client top talkers: dense
    Requests that never reached a target: rare
    Daily bytes in and out: dense
personas:
- name: analyst
  weight: 100
  think_time:
    dist: lognormal
    median_s: 20
    sigma: 0.5
    min_s: 2
    max_s: 180
  steps_from: saved
  weight_by: cron
  walk: sample
load:
  model: closed
  virtual_users: 10
  ramp:
  - to: 10
    over_s: 60
  - hold_s: 540
  duration: 600s
abort_if:
  error_rate_pct: 20
  p95_ms: 120000
  generator_drift_ms: 2000
