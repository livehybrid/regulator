# Regulator scenario pack-aws-elb-alb: searches written against the Stoker pack 'aws-elb-alb' (sourcetype aws:elb:accesslogs).
# Plain savedsearches.conf: drop it into an app's local/ directory and Splunk will
# schedule these searches itself. The classes Regulator uses are in scenario.yaml.
# Generated by tools/build_pack_scenarios.py; edit that file rather than this one.

[ALB status codes per minute]
search = index=main sourcetype=aws:elb:accesslogs | rex "^(?<type>\S+) \S+ (?<elb>\S+) (?<client_ip>[\d.]+):\d+ (?<target>\S+) (?<request_processing_time>\S+) (?<target_processing_time>\S+) (?<response_processing_time>\S+) (?<elb_status_code>\d+) (?<target_status_code>\S+) (?<received_bytes>\d+) (?<sent_bytes>\d+) \"(?<verb>\S+) (?<url>\S+) (?<proto>[^\"]+)\" \"(?<user_agent>[^\"]*)\"" | timechart span=1m count by elb_status_code
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
request.ui_dispatch_app = search

[ALB 5xx by target]
search = index=main sourcetype=aws:elb:accesslogs | rex "^(?<type>\S+) \S+ (?<elb>\S+) (?<client_ip>[\d.]+):\d+ (?<target>\S+) (?<request_processing_time>\S+) (?<target_processing_time>\S+) (?<response_processing_time>\S+) (?<elb_status_code>\d+) (?<target_status_code>\S+) (?<received_bytes>\d+) (?<sent_bytes>\d+) \"(?<verb>\S+) (?<url>\S+) (?<proto>[^\"]+)\" \"(?<user_agent>[^\"]*)\"" | search elb_status_code>=500 | stats count by target, target_status_code | sort - count
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Target latency percentiles by URL]
search = index=main sourcetype=aws:elb:accesslogs | rex "^(?<type>\S+) \S+ (?<elb>\S+) (?<client_ip>[\d.]+):\d+ (?<target>\S+) (?<request_processing_time>\S+) (?<target_processing_time>\S+) (?<response_processing_time>\S+) (?<elb_status_code>\d+) (?<target_status_code>\S+) (?<received_bytes>\d+) (?<sent_bytes>\d+) \"(?<verb>\S+) (?<url>\S+) (?<proto>[^\"]+)\" \"(?<user_agent>[^\"]*)\"" | rex field=url "^https?://(?<host>[^:/]+)" | stats perc50(target_processing_time) as p50, perc95(target_processing_time) as p95, count by host | sort - p95
dispatch.earliest_time = -30m
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 1
request.ui_dispatch_app = search

