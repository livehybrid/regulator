# Regulator scenario pack-host-infra-metrics: searches written against the Stoker pack 'host-infra-metrics' (sourcetype stoker:metric).
# Plain savedsearches.conf: drop it into an app's local/ directory and Splunk will
# schedule these searches itself. The classes Regulator uses are in scenario.yaml.
# Generated by tools/build_pack_scenarios.py; edit that file rather than this one.

[CPU by host]
search = | mstats avg(host.cpu.usage.pct) as cpu WHERE index=stoker_metrics span=1m BY host
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Memory ceiling by host]
search = | mstats max(host.memory.used.pct) as mem WHERE index=stoker_metrics span=5m BY host, region
dispatch.earliest_time = -6h
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Disk growth]
search = | mstats latest(host.disk.used.pct) as disk WHERE index=stoker_metrics span=1h BY host
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Load average peaks]
search = | mstats max(host.load.avg1m) as load WHERE index=stoker_metrics span=10m BY host | where load > 3
dispatch.earliest_time = -2h
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Network throughput by region]
search = | mstats sum(host.net.throughput.mbps) as mbps WHERE index=stoker_metrics span=5m BY region
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Every host metric, daily]
search = | mstats avg(host.*) WHERE index=stoker_metrics span=1h BY host
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
cron_schedule = 0 6 * * *
enableSched = 1
request.ui_dispatch_app = search
