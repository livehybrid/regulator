# Regulator scenario pack-attack-replay: searches written against the Stoker pack 'attack-replay' (sourcetype XmlWinEventLog).
# Plain savedsearches.conf: drop it into an app's local/ directory and Splunk will
# schedule these searches itself. The classes Regulator uses are in scenario.yaml.
# Generated by tools/build_pack_scenarios.py; edit that file rather than this one.

[Events by id]
search = index=main sourcetype=XmlWinEventLog | rex "<EventID>(?<EventID>\d+)</EventID>" | rex "<Computer>(?<Computer>[^<]+)</Computer>" | stats count by EventID | sort - count
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Process creations by computer]
search = index=main sourcetype=XmlWinEventLog "<EventID>1</EventID>" | rex "<EventID>(?<EventID>\d+)</EventID>" | rex "<Computer>(?<Computer>[^<]+)</Computer>" | stats count by Computer | sort - count
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Network connections by computer]
search = index=main sourcetype=XmlWinEventLog "<EventID>3</EventID>" | rex "<EventID>(?<EventID>\d+)</EventID>" | rex "<Computer>(?<Computer>[^<]+)</Computer>" | stats count by Computer | sort - count
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 1
request.ui_dispatch_app = search

[LSASS access]
search = index=main sourcetype=XmlWinEventLog "<EventID>10</EventID>" lsass.exe | rex "<EventID>(?<EventID>\d+)</EventID>" | rex "<Computer>(?<Computer>[^<]+)</Computer>" | table _time, Computer, _raw
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Logon failures]
search = index=main sourcetype=XmlWinEventLog "<EventID>4625</EventID>" | rex "<EventID>(?<EventID>\d+)</EventID>" | rex "<Computer>(?<Computer>[^<]+)</Computer>" | stats count by Computer | sort - count
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Hourly event volume by computer]
search = index=main sourcetype=XmlWinEventLog | rex "<EventID>(?<EventID>\d+)</EventID>" | rex "<Computer>(?<Computer>[^<]+)</Computer>" | timechart span=1h count by Computer
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
cron_schedule = 0 6 * * *
enableSched = 1
request.ui_dispatch_app = search
