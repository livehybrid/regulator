# Regulator scenario pack-apigw: searches written against the Stoker pack 'apigw' (sourcetype stoker:apigw).
# Plain savedsearches.conf: drop it into an app's local/ directory and Splunk will
# schedule these searches itself. The classes Regulator uses are in scenario.yaml.
# Generated by tools/build_pack_scenarios.py; edit that file rather than this one.

[API latency percentiles by path]
search = index=main sourcetype=stoker:apigw | stats perc50(dur_ms) as p50, perc95(dur_ms) as p95, count by path | sort - p95 | head 20
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
request.ui_dispatch_app = search

[API errors by upstream]
search = index=main sourcetype=stoker:apigw status>=500 | stats count by upstream, status | sort - count
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Gateway throughput by edge]
search = index=main sourcetype=stoker:apigw | timechart span=1m count by gw
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 1
request.ui_dispatch_app = search

[API keys over their fair share]
search = index=main sourcetype=stoker:apigw apikey_id=* | stats count by apikey_id | where count > 500 | sort - count
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Cache effectiveness]
search = index=main sourcetype=stoker:apigw | stats count by cache | eventstats sum(count) as total | eval pct=round(100*count/total, 1)
dispatch.earliest_time = -60m@m
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Requests slower than two seconds]
search = index=main sourcetype=stoker:apigw dur_ms>2000 | table _time, path, dur_ms, upstream, request_id | sort - dur_ms | head 100
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Daily requests per client and region]
search = index=main sourcetype=stoker:apigw | stats count, avg(dur_ms) as avg_ms by client_id, region | sort - count
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
cron_schedule = 0 7 * * *
enableSched = 1
request.ui_dispatch_app = search
