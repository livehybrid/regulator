# Regulator scenario pack-api-service-red-metrics: searches written against the Stoker pack 'api-service-red-metrics' (sourcetype stoker:metric).
# Plain savedsearches.conf: drop it into an app's local/ directory and Splunk will
# schedule these searches itself. The classes Regulator uses are in scenario.yaml.
# Generated by tools/build_pack_scenarios.py; edit that file rather than this one.

[Request rate by service]
search = | mstats sum(http.requests.total) as requests WHERE index=stoker_metrics span=1m BY service
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Error rate by service]
search = | mstats sum(http.errors.5xx.total) as errors, sum(http.requests.total) as requests WHERE index=stoker_metrics span=5m BY service | eval error_pct=round(100*errors/requests, 3)
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Latency p95 by service and method]
search = | mstats avg(http.latency.p95.ms) as p95 WHERE index=stoker_metrics span=5m BY service, method
dispatch.earliest_time = -2h
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Slowest services]
search = | mstats max(http.latency.p99.ms) as p99 WHERE index=stoker_metrics span=1h BY service | sort - p99
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Daily error budget]
search = | mstats sum(http.errors.5xx.total) as errors, sum(http.requests.total) as requests WHERE index=stoker_metrics span=1d BY service
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
cron_schedule = 0 6 * * *
enableSched = 1
request.ui_dispatch_app = search
