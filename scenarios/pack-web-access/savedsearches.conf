# Regulator scenario pack-web-access: searches written against the Stoker pack 'web-access' (sourcetype access_combined).
# Plain savedsearches.conf: drop it into an app's local/ directory and Splunk will
# schedule these searches itself. The classes Regulator uses are in scenario.yaml.
# Generated by tools/build_pack_scenarios.py; edit that file rather than this one.

[Web status codes every 5 minutes]
search = index=main sourcetype=access_combined | timechart span=5m count by status
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Top paths by requests]
search = index=main sourcetype=access_combined | stats count, sum(bytes) as bytes by uri_path | sort - count | head 50
dispatch.earliest_time = -60m@m
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 1
request.ui_dispatch_app = search

[5xx responses by path]
search = index=main sourcetype=access_combined status>=500 | stats count by uri_path, status | sort - count
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Bot share of traffic]
search = index=main sourcetype=access_combined | eval kind=if(match(useragent, "(?i)bot|crawler|spider"), "bot", "human") | stats count by kind
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
cron_schedule = 0 */6 * * *
enableSched = 1
request.ui_dispatch_app = search

[Scanner probes on paths that do not exist]
search = index=main sourcetype=access_combined (uri_path="*.php" OR uri_path="*wp-admin*" OR uri_path="*.env") | stats count by clientip, uri_path | sort - count | head 50
dispatch.earliest_time = -4h
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Daily traffic report]
search = index=main sourcetype=access_combined | timechart span=1h count, avg(bytes) as avg_bytes, dc(clientip) as clients
dispatch.earliest_time = -24h@h
dispatch.latest_time = @h
cron_schedule = 0 6 * * *
enableSched = 1
request.ui_dispatch_app = search

[Top talkers]
search = index=main sourcetype=access_combined | top limit=20 clientip
dispatch.earliest_time = -30m
dispatch.latest_time = now
cron_schedule = */30 * * * *
enableSched = 1
request.ui_dispatch_app = search
