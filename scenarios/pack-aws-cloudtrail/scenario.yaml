# Generated by tools/build_pack_scenarios.py from the Stoker pack 'aws-cloudtrail'.
#
# The searches live in savedsearches.conf next to this file, in Splunk's own
# format, so the same file can be installed into a Splunk app and scheduled by
# Splunk itself. This file says how Regulator applies them as load: which class
# each belongs to, how the population behaves and how hard to push.
#
# Two ways to run it. As shipped, a closed population of virtual users draws
# one search per iteration, weighted by how often each is scheduled. Change
# load.model to `schedule` (see scenarios/stoker-scheduler) and every search
# fires on its own cron instead, which is what Splunk's scheduler would do.
name: pack-aws-cloudtrail
engine: api
seed: 1103
description: 'CloudTrail as a security team schedules it: console logins, S3 data events, policy changes,
  role assumption and one correlation across event types'
tags:
- stoker-pack
- aws-cloudtrail
- aws
- cloudtrail
- security
corpus:
  requires_packs:
  - aws-cloudtrail
  index: main
  sourcetypes:
  - aws:cloudtrail
time_policy:
  mode: rolling
  window: 24h
  jitter: 30m
  align: 1m
searches:
  file: savedsearches.conf
  only_enabled: true
  time_from_saved: derived
  classes:
    Console logins by identity and source: sparse
    S3 data events by bucket: dense
    Bucket policy and bucket creation: rare
    Security group ingress changes: rare
    Role assumption by role: dense
    Activity by region: dense
    KMS usage by identity: dense
    Sources active across many event types: subsearch
personas:
- name: analyst
  weight: 100
  think_time:
    dist: lognormal
    median_s: 20
    sigma: 0.5
    min_s: 2
    max_s: 180
  steps_from: saved
  weight_by: cron
  walk: sample
load:
  model: closed
  virtual_users: 10
  ramp:
  - to: 10
    over_s: 60
  - hold_s: 540
  duration: 600s
abort_if:
  error_rate_pct: 20
  p95_ms: 120000
  generator_drift_ms: 2000
