# Regulator scenario pack-aws-cloudtrail: searches written against the Stoker pack 'aws-cloudtrail' (sourcetype aws:cloudtrail).
# Plain savedsearches.conf: drop it into an app's local/ directory and Splunk will
# schedule these searches itself. The classes Regulator uses are in scenario.yaml.
# Generated by tools/build_pack_scenarios.py; edit that file rather than this one.

[Console logins by identity and source]
search = index=main sourcetype=aws:cloudtrail eventName=ConsoleLogin | stats count by userIdentity.arn, sourceIPAddress | sort - count
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
request.ui_dispatch_app = search

[S3 data events by bucket]
search = index=main sourcetype=aws:cloudtrail eventSource=s3.amazonaws.com | stats count by eventName, requestParameters.bucketName | sort - count | head 50
dispatch.earliest_time = -30m
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Bucket policy and bucket creation]
search = index=main sourcetype=aws:cloudtrail (eventName=PutBucketPolicy OR eventName=CreateBucket OR eventName=GetBucketAcl) | table _time, eventName, userIdentity.arn, sourceIPAddress, awsRegion
dispatch.earliest_time = -7d@d
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Security group ingress changes]
search = index=main sourcetype=aws:cloudtrail eventName=AuthorizeSecurityGroupIngress | table _time, userIdentity.arn, sourceIPAddress, awsRegion, requestParameters.groupId
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Role assumption by role]
search = index=main sourcetype=aws:cloudtrail eventName=AssumeRole | stats count by requestParameters.roleArn, sourceIPAddress | sort - count
dispatch.earliest_time = -60m@m
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Activity by region]
search = index=main sourcetype=aws:cloudtrail | timechart span=1h count by awsRegion
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
cron_schedule = 0 6 * * *
enableSched = 1
request.ui_dispatch_app = search

[KMS usage by identity]
search = index=main sourcetype=aws:cloudtrail eventSource=kms.amazonaws.com | stats count by eventName, userIdentity.arn | sort - count
dispatch.earliest_time = -30m
dispatch.latest_time = now
cron_schedule = */30 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Sources active across many event types]
search = index=main sourcetype=aws:cloudtrail [ search index=main sourcetype=aws:cloudtrail eventName=ConsoleLogin | stats count by sourceIPAddress | fields sourceIPAddress | head 100 ] | stats dc(eventName) as kinds, count by sourceIPAddress | where kinds > 3 | sort - kinds
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 1
request.ui_dispatch_app = search
