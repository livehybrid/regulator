# Generated by tools/build_pack_scenarios.py. The searches are in savedsearches.conf.
# Splunk would skip searches over its concurrency limit; Regulator dispatches them all
# and records the queueing, since seeing it is the point.
name: stoker-scheduler
engine: api
seed: 1300
description: 'Every event pack''s scheduled searches fired on their own cron, as Splunk''s scheduler would:
  the top-of-the-hour burst is the point, because that is where a real cluster queues'
tags:
- stoker-pack
- schedule
- scheduler
corpus:
  requires_packs:
  - web-access
  - apigw
  - aws-cloudtrail
  - aws-s3-access
  - aws-elb-alb
  - splunk-tutorial-web
  - splunk-tutorial-secure
  - splunk-tutorial-vendor-sales
  - flatline
  - attack-replay
  index: main
  sourcetypes:
  - access_combined
  - stoker:apigw
  - aws:cloudtrail
  - aws:s3:accesslogs
  - aws:elb:accesslogs
  - access_combined_wcookie
  - linux_secure
  - vendor_sales
  - stoker:flatline
  - XmlWinEventLog
time_policy:
  mode: rolling
  window: 24h
  jitter: 30m
  align: 1m
searches:
  file: savedsearches.conf
  only_scheduled: true
  classes:
    'web-access: Web status codes every 5 minutes': dense
    'web-access: Top paths by requests': dense
    'web-access: 5xx responses by path': sparse
    'web-access: Bot share of traffic': dense
    'web-access: Scanner probes on paths that do not exist': rare
    'web-access: Daily traffic report': dense
    'web-access: Top talkers': dense
    'apigw: API latency percentiles by path': dense
    'apigw: API errors by upstream': sparse
    'apigw: Gateway throughput by edge': dense
    'apigw: API keys over their fair share': rare
    'apigw: Cache effectiveness': dense
    'apigw: Requests slower than two seconds': sparse
    'apigw: Daily requests per client and region': dense
    'aws-cloudtrail: Console logins by identity and source': sparse
    'aws-cloudtrail: S3 data events by bucket': dense
    'aws-cloudtrail: Bucket policy and bucket creation': rare
    'aws-cloudtrail: Security group ingress changes': rare
    'aws-cloudtrail: Role assumption by role': dense
    'aws-cloudtrail: Activity by region': dense
    'aws-cloudtrail: KMS usage by identity': dense
    'aws-cloudtrail: Sources active across many event types': subsearch
    'aws-s3-access: S3 operations by bucket': dense
    'aws-s3-access: S3 client and server errors': sparse
    'aws-s3-access: S3 deletes': rare
    'aws-s3-access: Bytes served per bucket': dense
    'aws-s3-access: Top keys by requests': dense
    'aws-s3-access: Slow S3 requests': sparse
    'aws-elb-alb: ALB status codes per minute': dense
    'aws-elb-alb: ALB 5xx by target': sparse
    'aws-elb-alb: Target latency percentiles by URL': dense
    'aws-elb-alb: Traffic by host': dense
    'aws-elb-alb: Client top talkers': dense
    'aws-elb-alb: Requests that never reached a target': rare
    'aws-elb-alb: Daily bytes in and out': dense
    'splunk-tutorial-web: Purchases by product': sparse
    'splunk-tutorial-web: Views by category': dense
    'splunk-tutorial-web: Sessions by page count': heavy
    'splunk-tutorial-web: Cart activity': sparse
    'splunk-tutorial-web: Errors by page': sparse
    'splunk-tutorial-web: Products added to cart but not bought': subsearch
    'splunk-tutorial-web: Daily revenue proxy by category': dense
    'splunk-tutorial-secure: Failed logins by source': sparse
    'splunk-tutorial-secure: Brute force sources': sparse
    'splunk-tutorial-secure: Invalid user attempts': dense
    'splunk-tutorial-secure: Accepted logins': rare
    'splunk-tutorial-secure: Failures per hour by user': dense
    'splunk-tutorial-secure: Success after repeated failure': subsearch
    'splunk-tutorial-vendor-sales: Sales by product code': dense
    'splunk-tutorial-vendor-sales: Top vendors': dense
    'splunk-tutorial-vendor-sales: Distinct accounts buying': dense
    'splunk-tutorial-vendor-sales: Sales from the highest vendor ids': rare
    'splunk-tutorial-vendor-sales: Vendors above the average': dense
    'splunk-tutorial-vendor-sales: Sales per hour': dense
    'flatline: Requests by service per minute': dense
    'flatline: Warnings and errors by service': sparse
    'flatline: Latency percentiles by service': dense
    'flatline: Slow calls': sparse
    'flatline: Daily volume by host': dense
    'attack-replay: Events by id': dense
    'attack-replay: Process creations by computer': sparse
    'attack-replay: Network connections by computer': sparse
    'attack-replay: LSASS access': rare
    'attack-replay: Logon failures': rare
    'attack-replay: Hourly event volume by computer': dense
personas:
- name: scheduler
  weight: 100
  think_time:
    dist: fixed
    value_s: 0
  steps_from: saved
  weight_by: cron
load:
  model: schedule
  duration: 1800s
  schedule_start: 08:55
abort_if:
  error_rate_pct: 25
  p95_ms: 300000
  generator_drift_ms: 3000
