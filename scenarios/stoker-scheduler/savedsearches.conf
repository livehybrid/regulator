[flatline: Latency percentiles by service]
search = index=main sourcetype=stoker:flatline | stats perc50(dur_ms) as p50, perc95(dur_ms) as p95 by svc
dispatch.earliest_time = -30m
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 1
request.ui_dispatch_app = search

[flatline: Slow calls]
search = index=main sourcetype=stoker:flatline dur_ms>300 | table _time, host, svc, msg, dur_ms | sort - dur_ms | head 100
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
request.ui_dispatch_app = search

[flatline: Daily volume by host]
search = index=main sourcetype=stoker:flatline | timechart span=1h count by host
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
cron_schedule = 0 6 * * *
enableSched = 1
request.ui_dispatch_app = search

[attack-replay: Events by id]
search = index=main sourcetype=XmlWinEventLog | rex "<EventID>(?<EventID>\d+)</EventID>" | rex "<Computer>(?<Computer>[^<]+)</Computer>" | stats count by EventID | sort - count
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
request.ui_dispatch_app = search

[attack-replay: Process creations by computer]
search = index=main sourcetype=XmlWinEventLog "<EventID>1</EventID>" | rex "<EventID>(?<EventID>\d+)</EventID>" | rex "<Computer>(?<Computer>[^<]+)</Computer>" | stats count by Computer | sort - count
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 1
request.ui_dispatch_app = search

