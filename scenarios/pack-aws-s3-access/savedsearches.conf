# Regulator scenario pack-aws-s3-access: searches written against the Stoker pack 'aws-s3-access' (sourcetype aws:s3:accesslogs).
# Plain savedsearches.conf: drop it into an app's local/ directory and Splunk will
# schedule these searches itself. The classes Regulator uses are in scenario.yaml.
# Generated by tools/build_pack_scenarios.py; edit that file rather than this one.

[S3 operations by bucket]
search = index=main sourcetype=aws:s3:accesslogs | rex "^\S+ (?<bucket>\S+) \[[^\]]+\] (?<remote_ip>\S+) (?<requester>\S+) (?<request_id>\S+) (?<operation>\S+) (?<key>\S+) \"(?<request>[^\"]*)\" (?<http_status>\d+) (?<error_code>\S+) (?<bytes_sent>\S+) (?<object_size>\S+) (?<total_time>\S+)" | stats count by bucket, operation | sort - count
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 1
request.ui_dispatch_app = search

[S3 client and server errors]
search = index=main sourcetype=aws:s3:accesslogs | rex "^\S+ (?<bucket>\S+) \[[^\]]+\] (?<remote_ip>\S+) (?<requester>\S+) (?<request_id>\S+) (?<operation>\S+) (?<key>\S+) \"(?<request>[^\"]*)\" (?<http_status>\d+) (?<error_code>\S+) (?<bytes_sent>\S+) (?<object_size>\S+) (?<total_time>\S+)" | search http_status>=400 | stats count by bucket, http_status, error_code | sort - count
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
request.ui_dispatch_app = search

[S3 deletes]
search = index=main sourcetype=aws:s3:accesslogs ("REST.DELETE.OBJECT" OR "MULTI_OBJECT_DELETE") | rex "^\S+ (?<bucket>\S+) \[[^\]]+\] (?<remote_ip>\S+) (?<requester>\S+) (?<request_id>\S+) (?<operation>\S+) (?<key>\S+) \"(?<request>[^\"]*)\" (?<http_status>\d+) (?<error_code>\S+) (?<bytes_sent>\S+) (?<object_size>\S+) (?<total_time>\S+)" | table _time, bucket, operation, key, requester, remote_ip
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Bytes served per bucket]
search = index=main sourcetype=aws:s3:accesslogs | rex "^\S+ (?<bucket>\S+) \[[^\]]+\] (?<remote_ip>\S+) (?<requester>\S+) (?<request_id>\S+) (?<operation>\S+) (?<key>\S+) \"(?<request>[^\"]*)\" (?<http_status>\d+) (?<error_code>\S+) (?<bytes_sent>\S+) (?<object_size>\S+) (?<total_time>\S+)" | eval bytes_sent=if(bytes_sent="-", 0, bytes_sent) | stats sum(bytes_sent) as bytes, count by bucket | sort - bytes
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
cron_schedule = 0 6 * * *
enableSched = 1
request.ui_dispatch_app = search

[Top keys by requests]
search = index=main sourcetype=aws:s3:accesslogs | rex "^\S+ (?<bucket>\S+) \[[^\]]+\] (?<remote_ip>\S+) (?<requester>\S+) (?<request_id>\S+) (?<operation>\S+) (?<key>\S+) \"(?<request>[^\"]*)\" (?<http_status>\d+) (?<error_code>\S+) (?<bytes_sent>\S+) (?<object_size>\S+) (?<total_time>\S+)" | stats count by key | sort - count | head 50
dispatch.earliest_time = -60m@m
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Slow S3 requests]
search = index=main sourcetype=aws:s3:accesslogs | rex "^\S+ (?<bucket>\S+) \[[^\]]+\] (?<remote_ip>\S+) (?<requester>\S+) (?<request_id>\S+) (?<operation>\S+) (?<key>\S+) \"(?<request>[^\"]*)\" (?<http_status>\d+) (?<error_code>\S+) (?<bytes_sent>\S+) (?<object_size>\S+) (?<total_time>\S+)" | where total_time > 1000 | table _time, bucket, operation, key, total_time | sort - total_time | head 100
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
request.ui_dispatch_app = search
