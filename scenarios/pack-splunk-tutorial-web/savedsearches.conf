# Regulator scenario pack-splunk-tutorial-web: searches written against the Stoker pack 'splunk-tutorial-web' (sourcetype access_combined_wcookie).
# Plain savedsearches.conf: drop it into an app's local/ directory and Splunk will
# schedule these searches itself. The classes Regulator uses are in scenario.yaml.
# Generated by tools/build_pack_scenarios.py; edit that file rather than this one.

[Purchases by product]
search = index=main sourcetype=access_combined_wcookie action=purchase status=200 | stats count by productId | sort - count | head 20
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Views by category]
search = index=main sourcetype=access_combined_wcookie categoryId=* | stats count by categoryId | sort - count
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Sessions by page count]
search = index=main sourcetype=access_combined_wcookie | transaction JSESSIONID maxspan=30m | stats avg(duration) as avg_session_s, avg(eventcount) as avg_pages, count as sessions
dispatch.earliest_time = -60m@m
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Cart activity]
search = index=main sourcetype=access_combined_wcookie uri_path="/cart.do" | stats count by action | sort - count
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Errors by page]
search = index=main sourcetype=access_combined_wcookie status>=400 | stats count by uri_path, status | sort - count
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Products added to cart but not bought]
search = index=main sourcetype=access_combined_wcookie action=addtocart NOT [ search index=main sourcetype=access_combined_wcookie action=purchase | stats count by JSESSIONID | fields JSESSIONID | head 1000 ] | stats count by productId | sort - count | head 20
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Daily revenue proxy by category]
search = index=main sourcetype=access_combined_wcookie action=purchase | timechart span=1h count by categoryId
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
cron_schedule = 0 6 * * *
enableSched = 1
request.ui_dispatch_app = search
