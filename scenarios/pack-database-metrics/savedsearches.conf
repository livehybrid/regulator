# Regulator scenario pack-database-metrics: searches written against the Stoker pack 'database-metrics' (sourcetype stoker:metric).
# Plain savedsearches.conf: drop it into an app's local/ directory and Splunk will
# schedule these searches itself. The classes Regulator uses are in scenario.yaml.
# Generated by tools/build_pack_scenarios.py; edit that file rather than this one.

[Connections by cluster]
search = | mstats avg(db.connections.active) as connections WHERE index=stoker_metrics span=1m BY cluster, role
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Queries per second]
search = | mstats avg(db.queries.per_sec) as qps WHERE index=stoker_metrics span=5m BY cluster
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Cache hit ratio floor]
search = | mstats min(db.cache.hit_ratio.pct) as hit WHERE index=stoker_metrics span=10m BY cluster | where hit < 90
dispatch.earliest_time = -2h
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Replication lag on replicas]
search = | mstats max(db.replication.lag.seconds) as lag WHERE index=stoker_metrics AND role=replica span=1m BY cluster
dispatch.earliest_time = -30m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Slow queries, daily]
search = | mstats sum(db.slow_queries.total) as slow WHERE index=stoker_metrics span=1h BY cluster
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
cron_schedule = 0 6 * * *
enableSched = 1
request.ui_dispatch_app = search
