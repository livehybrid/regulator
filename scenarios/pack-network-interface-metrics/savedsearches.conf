# Regulator scenario pack-network-interface-metrics: searches written against the Stoker pack 'network-interface-metrics' (sourcetype stoker:metric).
# Plain savedsearches.conf: drop it into an app's local/ directory and Splunk will
# schedule these searches itself. The classes Regulator uses are in scenario.yaml.
# Generated by tools/build_pack_scenarios.py; edit that file rather than this one.

[Throughput by device]
search = | mstats avg(net.if.in.mbps) as in_mbps, avg(net.if.out.mbps) as out_mbps WHERE index=stoker_metrics span=1m BY device
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Utilisation over 80 percent]
search = | mstats max(net.if.utilization.pct) as util WHERE index=stoker_metrics span=5m BY device, interface | where util > 80
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Interface errors]
search = | mstats sum(net.if.errors.per_sec) as errors WHERE index=stoker_metrics span=10m BY device, interface | where errors > 0
dispatch.earliest_time = -2h
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Discards by device]
search = | mstats sum(net.if.discards.per_sec) as discards WHERE index=stoker_metrics span=1h BY device
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Daily utilisation by interface]
search = | mstats avg(net.if.utilization.pct) as util WHERE index=stoker_metrics span=1h BY device, interface
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
cron_schedule = 0 6 * * *
enableSched = 1
request.ui_dispatch_app = search
