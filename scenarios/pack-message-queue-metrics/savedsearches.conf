# Regulator scenario pack-message-queue-metrics: searches written against the Stoker pack 'message-queue-metrics' (sourcetype stoker:metric).
# Plain savedsearches.conf: drop it into an app's local/ directory and Splunk will
# schedule these searches itself. The classes Regulator uses are in scenario.yaml.
# Generated by tools/build_pack_scenarios.py; edit that file rather than this one.

[Publish and consume rates]
search = | mstats sum(mq.messages.published.per_sec) as published, sum(mq.messages.consumed.per_sec) as consumed WHERE index=stoker_metrics span=1m BY topic
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Consumer lag by group]
search = | mstats max(mq.consumer.lag.messages) as lag WHERE index=stoker_metrics span=5m BY topic, consumer_group
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Queue depth peaks]
search = | mstats max(mq.queue.depth.messages) as depth WHERE index=stoker_metrics span=10m BY topic | where depth > 10000
dispatch.earliest_time = -6h
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Dead letter volume]
search = | mstats sum(mq.messages.published.per_sec) as published WHERE index=stoker_metrics AND topic=deadletter span=1h
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Daily throughput by topic]
search = | mstats sum(mq.messages.consumed.per_sec) as consumed WHERE index=stoker_metrics span=1h BY topic
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
cron_schedule = 0 6 * * *
enableSched = 1
request.ui_dispatch_app = search
