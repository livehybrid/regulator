# Regulator scenario pack-splunk-tutorial-secure: searches written against the Stoker pack 'splunk-tutorial-secure' (sourcetype linux_secure).
# Plain savedsearches.conf: drop it into an app's local/ directory and Splunk will
# schedule these searches itself. The classes Regulator uses are in scenario.yaml.
# Generated by tools/build_pack_scenarios.py; edit that file rather than this one.

[Failed logins by source]
search = index=main sourcetype=linux_secure "Failed password" | rex "(?:for (?:invalid user )?(?<user>\S+) )?from (?<src_ip>\d+\.\d+\.\d+\.\d+)" | stats count by src_ip | sort - count | head 50
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Brute force sources]
search = index=main sourcetype=linux_secure "Failed password" | rex "(?:for (?:invalid user )?(?<user>\S+) )?from (?<src_ip>\d+\.\d+\.\d+\.\d+)" | stats count, dc(user) as users by src_ip | where count > 20 | sort - count
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Invalid user attempts]
search = index=main sourcetype=linux_secure "Invalid user" | rex "(?:for (?:invalid user )?(?<user>\S+) )?from (?<src_ip>\d+\.\d+\.\d+\.\d+)" | stats count by user | sort - count | head 50
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Accepted logins]
search = index=main sourcetype=linux_secure "Accepted password" | rex "(?:for (?:invalid user )?(?<user>\S+) )?from (?<src_ip>\d+\.\d+\.\d+\.\d+)" | table _time, host, user, src_ip
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Failures per hour by user]
search = index=main sourcetype=linux_secure "Failed password" | rex "(?:for (?:invalid user )?(?<user>\S+) )?from (?<src_ip>\d+\.\d+\.\d+\.\d+)" | timechart span=1h count by user limit=10
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Success after repeated failure]
search = index=main sourcetype=linux_secure "Accepted password" | rex "(?:for (?:invalid user )?(?<user>\S+) )?from (?<src_ip>\d+\.\d+\.\d+\.\d+)" | search [ search index=main sourcetype=linux_secure "Failed password" | rex "(?:for (?:invalid user )?(?<user>\S+) )?from (?<src_ip>\d+\.\d+\.\d+\.\d+)" | stats count by src_ip | where count > 10 | fields src_ip | head 500 ] | table _time, user, src_ip
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = 0 * * * *
enableSched = 1
request.ui_dispatch_app = search
