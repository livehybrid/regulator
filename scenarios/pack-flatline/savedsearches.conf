# Regulator scenario pack-flatline: searches written against the Stoker pack 'flatline' (sourcetype stoker:flatline).
# Plain savedsearches.conf: drop it into an app's local/ directory and Splunk will
# schedule these searches itself. The classes Regulator uses are in scenario.yaml.
# Generated by tools/build_pack_scenarios.py; edit that file rather than this one.

[Requests by service per minute]
search = index=main sourcetype=stoker:flatline | timechart span=1m count by svc
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Warnings and errors by service]
search = index=main sourcetype=stoker:flatline (level=WARN OR level=ERROR) | stats count by svc, level, msg | sort - count
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Latency percentiles by service]
search = index=main sourcetype=stoker:flatline | stats perc50(dur_ms) as p50, perc95(dur_ms) as p95 by svc
dispatch.earliest_time = -30m
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Slow calls]
search = index=main sourcetype=stoker:flatline dur_ms>300 | table _time, host, svc, msg, dur_ms | sort - dur_ms | head 100
dispatch.earliest_time = -15m
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Daily volume by host]
search = index=main sourcetype=stoker:flatline | timechart span=1h count by host
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
cron_schedule = 0 6 * * *
enableSched = 1
request.ui_dispatch_app = search
