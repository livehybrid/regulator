# Regulator scenario pack-k8s-workload-metrics: searches written against the Stoker pack 'k8s-workload-metrics' (sourcetype stoker:metric).
# Plain savedsearches.conf: drop it into an app's local/ directory and Splunk will
# schedule these searches itself. The classes Regulator uses are in scenario.yaml.
# Generated by tools/build_pack_scenarios.py; edit that file rather than this one.

[Container CPU by namespace]
search = | mstats avg(k8s.container.cpu.cores) as cores WHERE index=stoker_metrics span=1m BY namespace, workload
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Memory by workload]
search = | mstats max(k8s.container.memory.mb) as mb WHERE index=stoker_metrics span=5m BY namespace, workload
dispatch.earliest_time = -6h
dispatch.latest_time = now
cron_schedule = */10 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Pod restarts]
search = | mstats sum(k8s.pod.restarts.total) as restarts WHERE index=stoker_metrics span=1h BY namespace | where restarts > 0
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = */15 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Ready replicas]
search = | mstats min(k8s.workload.replicas.ready) as ready WHERE index=stoker_metrics span=5m BY namespace, workload
dispatch.earliest_time = -30m
dispatch.latest_time = now
cron_schedule = */5 * * * *
enableSched = 1
request.ui_dispatch_app = search

[Network receive by namespace, daily]
search = | mstats avg(k8s.container.net.rx.kbps) as kbps WHERE index=stoker_metrics span=1h BY namespace
dispatch.earliest_time = -24h@h
dispatch.latest_time = now
cron_schedule = 0 6 * * *
enableSched = 1
request.ui_dispatch_app = search
