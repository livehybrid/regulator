[regulator_run_completed]
search = sourcetype=regulator:lifecycle kind=run_completed

[regulator_run_invalid]
search = sourcetype=regulator:lifecycle kind=run_* valid=false

[regulator_worker_lost]
search = sourcetype=regulator:lifecycle kind=worker_lost

[regulator_cache_evicted]
search = sourcetype=regulator:lifecycle kind=cache_evicted

[regulator_queueing]
search = sourcetype=regulator:sample interval.queued>0
