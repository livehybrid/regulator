# Regulator telemetry: every event is one JSON object posted to HEC's event
# endpoint, so the timestamp is HEC's own "time" field and the body is
# extracted as JSON at search time. Nothing here is index-time.

[regulator:step]
SHOULD_LINEMERGE = false
KV_MODE = json
TRUNCATE = 100000
DATETIME_CONFIG = NONE

[regulator:run]
SHOULD_LINEMERGE = false
KV_MODE = json
# A fleet's merged summary carries every worker's per-step figures.
TRUNCATE = 0
DATETIME_CONFIG = NONE

[regulator:sample]
SHOULD_LINEMERGE = false
KV_MODE = json
TRUNCATE = 50000
DATETIME_CONFIG = NONE

[regulator:lifecycle]
SHOULD_LINEMERGE = false
KV_MODE = json
TRUNCATE = 50000
DATETIME_CONFIG = NONE

[regulator:health]
SHOULD_LINEMERGE = false
KV_MODE = json
TRUNCATE = 20000
DATETIME_CONFIG = NONE

# Stoker's dogfood telemetry, read by the Ingest vs search dashboard. The same
# settings as Stoker's own observability app, so this app works without it and
# the two agree when both are installed.
[stoker:metrics]
KV_MODE = json

[stoker:job]
KV_MODE = json
