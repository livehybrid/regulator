# The dashboards a browser run opens.
#
# They exist so a browser benchmark is comparable between a homelab and a
# customer cluster. Pointing the scenario at whatever dashboards a site happens
# to have makes its numbers comparable only with themselves, which is fine for
# tracking one cluster over time and useless for comparing two.
[install]
is_configured = true
state = enabled

[ui]
is_visible = true
label = Regulator SUT

[launcher]
author = Will Searle
description = Graded dashboards for browser-based Splunk load testing with Regulator
version = 0.1.0

[package]
id = regulator_sut
